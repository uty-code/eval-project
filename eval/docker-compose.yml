# ==========================================================================
# [현재 설정]
# - Spring Boot는 호스트(mvnw)에서 직접 실행
# - spring.docker.compose.enabled=true 설정 시 앱 시작과 함께 ngrok 자동 기동
# - ngrok이 호스트 8080 포트를 외부로 터널링
# ==========================================================================
version: '3.8'

services:
  # ── 로컬 테스트용 SQL Server ──
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ees_mssql_local
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EesLocal@2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - ees_mssql_data:/var/opt/mssql

  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: jenkins
    user: root
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins_home:/var/jenkins_home
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ees_ngrok
    restart: unless-stopped
    environment:
      - NGROK_AUTHTOKEN=3Bh9g49Mkxf99eiJV7E1wuIGCg3_4NiHHxTwyB6GASX2HqBn1
    command:
      - "http"
      - "host.docker.internal:8080"
      - "--domain=unostensively-demographical-hanna.ngrok-free.dev"

volumes:
  ees_mssql_data:
  jenkins_home:
    external: true
