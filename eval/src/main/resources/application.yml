server:
  forward-headers-strategy: framework
  error:
    path: /error-page
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  # [무중단 안정성] 배포 시점에 트래픽 유실 및 커넥션 갑작스런 단절 예방용 우아한 종료 지원
  shutdown: graceful

# [보안 고도화] 액츄에이터 노출을 헬스체크 하나로 철저 봉쇄 및 상세 정보 노출 차단
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

spring:
  # [보안 혁신] 기본 fallback인 dev를 강제 철폐하고, 주입되지 않았을 때 명시적인 구동 실패를 유도하여 학교 DB 훼손 방지
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
      cache:
        period: 3600
        cachecontrol:
          max-age: 3600
          cache-public: true
  sql:
    init:
      mode: never
      schema-locations: classpath:eval-schema.sql
      data-locations: classpath:truncate_data.sql, classpath:eval-data.sql
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30

logging:
  level:
    root: INFO

---
# [dev] 로컬 개발 환경 - 학교 공용 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlserver://211.232.94.161:1533;databaseName=SKUEDU;encrypt=true;trustServerCertificate=true;
    username: SKUEDU01
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  docker:
    compose:
      enabled: false
  # Thymeleaf 캐시 비활성화로 신속한 프론트 반영 유도
  thymeleaf:
    cache: false

# 개발 및 디버그용 SQL 파라미터 로깅
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.ees.eval: DEBUG

---
# [prod] Azure 운영 환경 - Azure SQL DB
spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      mode: never
  datasource:
    # 환경변수 주입이 없을 경우 기본값으로 Azure DB 주소를 매핑하여 완벽한 하이브리드 호환성 보장
    url: ${DB_URL:jdbc:sqlserver://ees-server-hk.database.windows.net:1433;databaseName=ees-db-hk;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
    username: ${DB_USERNAME:dbmaster}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    # [성능 극상] MSSQL 실무 운영 환경의 커넥션 가용성을 책임지는 HikariCP 최적 튠업
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 운영 환경은 Thymeleaf 캐시 활성화하여 CPU/메모리 부하 및 응답 응집도 성능 보장
  thymeleaf:
    cache: true

---
# [local] 로컬 테스트 환경 - Docker SQL Server
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=EES_LOCAL;encrypt=true;trustServerCertificate=true;
    username: sa
    password: EesLocal@2026!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
      schema-locations: classpath:eval-schema.sql
      continue-on-error: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start_only
  thymeleaf:
    cache: false

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.ees.eval: DEBUG
