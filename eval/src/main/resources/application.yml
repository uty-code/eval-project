server:
  forward-headers-strategy: framework
  error:
    path: /error-page
  compression:
    enabled: true
    mime-types: text/html,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

# [보안 고도화] 운영 환경 액츄에이터 노출을 헬스체크(health) 하나로 철저 제한 (민감 데이터 유출 완전 봉쇄)
management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  cache:
    type: caffeine
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
      cache:
        period: 3600
        cachecontrol:
          max-age: 3600
          cache-public: true
  thymeleaf:
    cache: false
  sql:
    init:
      mode: never
      schema-locations: classpath:eval-schema.sql
      data-locations: classpath:truncate_data.sql, classpath:eval-data.sql
      encoding: UTF-8

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-statement-timeout: 30
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    root: INFO
    com.ees.eval: DEBUG

---
# [dev] 로컬 개발 환경 - 학교 공용 DB
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:sqlserver://211.232.94.161:1533;databaseName=SKUEDU;encrypt=true;trustServerCertificate=true;
    username: SKUEDU01
    password: ${DEV_DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  docker:
    compose:
      enabled: false

---
# [prod] Azure 운영 환경 - Azure SQL DB
spring:
  config:
    activate:
      on-profile: prod
  sql:
    init:
      mode: never  # 테이블 생성이 완료되었으므로 안전을 위해 never로 원복
  datasource:
    # 환경변수 주입이 없을 경우 기본값으로 Azure DB 주소를 매핑하여 완벽한 하이브리드 호환성 보장
    url: ${DB_URL:jdbc:sqlserver://ees-server-hk.database.windows.net:1433;databaseName=ees-db-hk;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;}
    username: ${DB_USERNAME:dbmaster}
    # 비밀번호는 환경변수에서 로드합니다.
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

---
# [local] 로컬 테스트 환경 - Docker SQL Server
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=EES_LOCAL;encrypt=true;trustServerCertificate=true;
    username: sa
    password: EesLocal@2026!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  sql:
    init:
      mode: never
      schema-locations: classpath:eval-schema.sql
      continue-on-error: true
  docker:
    compose:
      enabled: true
      lifecycle-management: start_only
