<aside th:fragment="sidebar(activeMenu)" class="sidebar" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <!-- Sidebar Toggle Button -->
    <div class="sidebar-toggle-container">
        <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle" title="사이드바 접기/펴기">
            <i class="bi bi-list"></i>
        </button>
    </div>

    <div class="px-3 mb-4">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">메인 메뉴</h6>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/}" th:attr="hx-get=@{/}" hx-target="#page-content" hx-select="#page-content"
                hx-swap="outerHTML" hx-push-url="true"
                th:classappend="${activeMenu == 'dashboard' ? 'active' : ''}">
                <i class="bi bi-speedometer2"></i>
                <span>대시보드</span>
            </a>
        </nav>
    </div>

    <div class="px-3 mb-4" sec:authorize="hasRole('ADMIN')">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">조직 및 인사 관리</h6>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/departments}" hx-get="/departments" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                th:classappend="${activeMenu == 'departments' ? 'active' : ''}">
                <i class="bi bi-diagram-3-fill"></i>
                <span>부서 관리</span>
            </a>
            <a class="nav-link" th:href="@{/employees}" hx-get="/employees" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                th:classappend="${activeMenu == 'employees' ? 'active' : ''}">
                <i class="bi bi-people-fill"></i>
                <span>사원 관리</span>
                <span id="sidebar-pending-badge" hx-swap-oob="true" class="ees-badge ees-badge-multi ms-1" th:if="${pendingCount > 0}"
                    th:text="${pendingCount}"></span>
            </a>
        </nav>
    </div>

    <div class="px-3 mb-4" sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'EXECUTIVE')">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">평가 기준 설정</h6>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/eval/periods}" hx-get="/eval/periods" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true" hx-history="false"
                sec:authorize="hasRole('ADMIN')"
                th:classappend="${activeMenu == 'periods' ? 'active' : ''}">
                <i class="bi bi-calendar-check-fill"></i>
                <span>평가 차수 설정</span>
            </a>
            <a class="nav-link" th:href="@{/eval/elements}" hx-get="/eval/elements" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                sec:authorize="hasRole('ADMIN')"
                th:classappend="${activeMenu == 'elements' ? 'active' : ''}">
                <i class="bi bi-list-check"></i>
                <span>평가요소 관리</span>
            </a>
            <a class="nav-link" th:href="@{/eval/evaluators}" hx-get="/eval/evaluators" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true" hx-history="false"
                th:classappend="${activeMenu == 'evaluators' ? 'active' : ''}">
                <i class="bi bi-person-lines-fill"></i>
                <span>평가자 관리</span>
            </a>
        </nav>
    </div>

    <div class="px-3 mb-4">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">평가 수행 및 관리</h6>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/eval/my-evaluation}" hx-get="/eval/my-evaluation" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                sec:authorize="!hasRole('ADMIN')"
                th:classappend="${activeMenu == 'my-evaluation' ? 'active' : ''}">
                <i class="bi bi-person-workspace"></i>
                <span>나의 자가평가</span>
            </a>
            <a class="nav-link" th:href="@{/eval/performance}" hx-get="/eval/performance" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                sec:authorize="hasAnyRole('ADMIN', 'MANAGER')"
                th:classappend="${activeMenu == 'performance-eval' ? 'active' : ''}">
                <i class="bi bi-pencil-square"></i>
                <span>성과/역량 평가</span>
            </a>
            <a class="nav-link" th:href="@{/eval/multi-dimensional}" hx-get="/eval/multi-dimensional" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                sec:authorize="!hasAnyRole('MANAGER', 'EXECUTIVE')"
                th:classappend="${activeMenu == 'multi-dimensional-eval' ? 'active' : ''}">
                <i class="bi bi-people"></i>
                <span>다면 평가</span>
            </a>
            <a class="nav-link" th:href="@{/eval/interview}" hx-get="/eval/interview" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                th:classappend="${activeMenu == 'interview-mgmt' ? 'active' : ''}">
                <i class="bi bi-chat-left-text-fill"></i>
                <span sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'EXECUTIVE')">면담 관리</span>
                <span sec:authorize="!hasAnyRole('ADMIN', 'MANAGER', 'EXECUTIVE')">나의 면담 결과</span>
            </a>
            <a class="nav-link" th:href="@{/eval/final-grade}" hx-get="/eval/final-grade" hx-target="#page-content"
                hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                sec:authorize="hasAnyRole('ADMIN', 'EXECUTIVE')"
                th:classappend="${activeMenu == 'final-grade' ? 'active' : ''}">
                <i class="bi bi-check-all"></i>
                <span>최종 등급 확정</span>
            </a>
        </nav>
    </div>

    <div class="px-3 mb-4" sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'EXECUTIVE')">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">결과 및 현황</h6>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/eval/result}"
                hx-get="/eval/result" hx-target="#page-content" hx-select="#page-content"
                hx-swap="outerHTML" hx-push-url="true"
                th:classappend="${activeMenu == 'eval-result' ? 'active' : ''}">
                <i class="bi bi-bar-chart-line-fill"></i>
                <span>평가 결과 현황</span>
            </a>
        </nav>
    </div>

    <div class="px-3 mb-4" sec:authorize="hasRole('ADMIN')">
        <h6 class="text-uppercase text-muted fw-bold small px-3 mb-3">시스템 설정</h6>
        <nav class="nav flex-column">
            <a class="nav-link" th:href="@{/admin/login-logs}"
                th:classappend="${activeMenu == 'admin-login-logs' ? 'active' : ''}">
                <i class="bi bi-clock-history"></i>
                <span>로그인 이력</span>
            </a>
            <a class="nav-link" th:href="@{/admin/api-logs}"
                th:classappend="${activeMenu == 'admin-api-logs' ? 'active' : ''}">
                <i class="bi bi-journal-text"></i>
                <span>API 호출 이력</span>
            </a>
        </nav>
    </div>


</aside>
