<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'admin-login-logs', ~{}, ~{})}">

<head>
    <title>로그인 이력 - EES 사원 평가 시스템</title>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" data-bs-theme="dark">

        <!-- Page Header -->
        <div class="row align-items-center mb-4">
            <div class="col">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item">
                            <a th:href="@{/}" class="text-primary text-decoration-none">대시보드</a>
                        </li>
                        <li class="breadcrumb-item active text-muted">로그인 이력</li>
                    </ol>
                </nav>
                <h1 class="fw-bold fs-3 mb-0">
                    <i class="bi bi-clock-history me-2 text-primary"></i>로그인 이력
                </h1>
            </div>
            <div class="col-auto d-flex gap-2">
                <a th:href="@{/admin/login-logs}"
                   class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-list-ul me-1"></i>전체 이력 보기
                </a>
            </div>
        </div>

        <!-- 통계 카드 -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-white"
                         th:text="${pageResponse.totalElements}">0</div>
                    <div class="text-muted small mt-1">전체 기록</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-success"
                         th:text="${#lists.size(logs.?[resultCode == 'SUCCESS'])}">0</div>
                    <div class="text-muted small mt-1">로그인 성공</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-danger"
                         th:text="${#lists.size(logs.?[resultCode != 'SUCCESS'])}">0</div>
                    <div class="text-muted small mt-1">로그인 실패</div>
                </div>
            </div>
            <div class="col-sm-6 col-lg-3">
                <div class="ees-card p-4 text-center">
                    <div class="fs-1 fw-bold text-warning"
                         th:text="${#lists.size(logs.?[resultCode == 'FAIL_LOCKED'])}">0</div>
                    <div class="text-muted small mt-1">계정 잠금 시도</div>
                </div>
            </div>
        </div>

        <!-- 고급 가로 카드형 필터 바 (Glassmorphic) -->
        <div class="ees-card p-4 mb-4">
            <form th:action="@{/admin/login-logs}" method="get" class="row g-3 align-items-end" id="searchForm">
                <!-- 사번 검색 영역 -->
                <div class="col-12 col-md-5">
                    <label class="form-label text-muted small fw-semibold mb-2" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                        <i class="bi bi-person-badge text-primary me-1"></i>사번 검색
                    </label>
                    <div class="input-group">
                        <input type="text" name="searchEmpId" id="searchEmpId" th:value="${searchEmpId}"
                               class="form-control bg-dark bg-opacity-25 border-secondary border-opacity-50 text-white rounded-start"
                               style="height: 48px; border-right: none;" placeholder="사원 번호 입력...">
                        <button type="button" class="btn btn-outline-secondary border-secondary border-opacity-50 bg-dark bg-opacity-25"
                                style="height: 48px; border-left: none; color: #a5b4fc; border-top-right-radius: 8px; border-bottom-right-radius: 8px;"
                                onclick="window.openEmployeeSelector((emp) => { document.getElementById('searchEmpId').value = emp.id; })"
                                title="사원 검색 모달 열기">
                            <i class="bi bi-person-plus-fill"></i> 사원 지정
                        </button>
                    </div>
                </div>
                <!-- IP 주소 검색 영역 -->
                <div class="col-12 col-md-5">
                    <label class="form-label text-muted small fw-semibold mb-2" style="font-size: 0.85rem; letter-spacing: 0.5px;">
                        <i class="bi bi-globe text-primary me-1"></i>접속 IP 검색
                    </label>
                    <input type="text" name="searchIp" th:value="${searchIp}"
                           class="form-control bg-dark bg-opacity-25 border-secondary border-opacity-50 text-white"
                           style="height: 48px; border-radius: 8px;" placeholder="접속 IP 주소 입력 (예: 127.0.0.1)...">
                </div>
                <!-- 버튼 그룹 -->
                <div class="col-12 col-md-2 d-flex gap-2">
                    <!-- 조회 버튼 -->
                    <button type="submit" class="btn fw-semibold w-100 text-white d-flex align-items-center justify-content-center gap-1"
                            style="height: 48px; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); border: none; border-radius: 8px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);">
                        <i class="bi bi-search"></i> 조회
                    </button>
                    <!-- 리셋 버튼 -->
                    <a th:href="@{/admin/login-logs}" class="btn btn-outline-secondary d-flex align-items-center justify-content-center"
                       style="height: 48px; width: 48px; min-width: 48px; border-radius: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);"
                       title="검색 조건 초기화">
                        <i class="bi bi-arrow-counterclockwise text-white-50" style="font-size: 1.2rem;"></i>
                    </a>
                </div>
            </form>
        </div>

        <!-- 테이블 카드 -->
        <div class="ees-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-table me-2 text-primary"></i>상세 이력 목록
                </h5>
            </div>

            <div class="table-responsive">
                <table class="ees-table" id="log-table">
                    <thead>
                        <tr style="border-color:rgba(255,255,255,0.1);">
                            <th class="text-muted small fw-semibold">#</th>
                            <th class="text-muted small fw-semibold">일시</th>
                            <th class="text-muted small fw-semibold">사번 (입력값)</th>
                            <th class="text-muted small fw-semibold">결과</th>
                            <th class="text-muted small fw-semibold">IP 주소</th>
                            <th class="text-muted small fw-semibold">브라우저</th>
                        </tr>
                    </thead>
                    <tbody id="log-tbody">
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                로그인 이력이 없습니다.
                            </td>
                        </tr>
                        <tr th:each="log, stat : ${logs}"
                            style="border-color:rgba(255,255,255,0.06);">
                            <td class="text-muted small" th:text="${stat.count}">1</td>
                            <td class="small text-white-50"
                                th:text="${log.createdAt != null ?
                                    #temporals.format(log.createdAt, 'yyyy-MM-dd HH:mm:ss') : '-'}">-</td>
                            <td>
                                <span class="fw-semibold" th:text="${log.loginInput}">-</span>
                                <span th:if="${log.empId != null}"
                                      class="ms-1 text-muted small">(emp: <span th:text="${log.empId}"></span>)</span>
                            </td>
                            <td>
                                <!-- 성공 -->
                                <span th:if="${log.resultCode == 'SUCCESS'}"
                                      class="ees-badge ees-badge-self">
                                    <i class="bi bi-check-circle-fill"></i>성공
                                </span>
                                <!-- 잠금 -->
                                <span th:if="${log.resultCode == 'FAIL_LOCKED'}"
                                      class="ees-badge ees-badge-multi">
                                    <i class="bi bi-lock-fill"></i>계정 잠금
                                </span>
                                <!-- 퇴사 -->
                                <span th:if="${log.resultCode == 'FAIL_RETIRED'}"
                                      class="ees-badge ees-badge-executive">
                                    <i class="bi bi-door-closed-fill"></i>퇴사 계정
                                </span>
                                <!-- 승인 대기 -->
                                <span th:if="${log.resultCode == 'FAIL_PENDING'}"
                                      class="ees-badge ees-badge-performance">
                                    <i class="bi bi-hourglass-split"></i>승인 대기
                                </span>
                                <!-- 비밀번호 불일치 -->
                                <span th:if="${log.resultCode == 'FAIL_INVALID'}"
                                      class="ees-badge" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;">
                                    <i class="bi bi-x-circle-fill"></i>인증 실패
                                </span>
                                <!-- 기타 -->
                                <span th:unless="${log.resultCode == 'SUCCESS' or
                                                  log.resultCode == 'FAIL_LOCKED' or
                                                  log.resultCode == 'FAIL_RETIRED' or
                                                  log.resultCode == 'FAIL_PENDING' or
                                                  log.resultCode == 'FAIL_INVALID'}"
                                      class="ees-badge ees-badge-performance"
                                      th:text="${log.resultCode}">기타</span>
                            </td>
                            <td class="small text-white-50 font-monospace"
                                th:text="${log.ipAddress ?: '-'}">-</td>
                            <td class="small text-muted"
                                style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
                                th:text="${log.userAgent ?: '-'}"
                                th:title="${log.userAgent}">-</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <nav th:if="${pageResponse.totalPages > 1}" class="mt-4" aria-label="Page navigation">
            <ul class="pagination justify-content-center pagination-sm">
                <!-- 이전 페이지 -->
                <li class="page-item" th:classappend="${pageResponse.currentPage == 1} ? 'disabled'">
                    <a class="page-link bg-dark border-secondary text-white" 
                       th:href="@{/admin/login-logs(page=${pageResponse.currentPage - 1}, searchEmpId=${searchEmpId}, searchIp=${searchIp})}">이전</a>
                </li>
                
                <!-- 페이지 번호 -->
                <li class="page-item" 
                    th:each="pageNum : ${#numbers.sequence(
                        pageResponse.currentPage - 5 < 1 ? 1 : pageResponse.currentPage - 5,
                        pageResponse.currentPage + 5 > pageResponse.totalPages ? pageResponse.totalPages : pageResponse.currentPage + 5)}"
                    th:classappend="${pageNum == pageResponse.currentPage} ? 'active'">
                    <a class="page-link border-secondary"
                       th:classappend="${pageNum == pageResponse.currentPage} ? 'bg-primary text-white border-primary' : 'bg-dark text-white'"
                       th:href="@{/admin/login-logs(page=${pageNum}, searchEmpId=${searchEmpId}, searchIp=${searchIp})}"
                       th:text="${pageNum}">1</a>
                </li>
                
                <!-- 다음 페이지 -->
                <li class="page-item" th:classappend="${pageResponse.currentPage == pageResponse.totalPages} ? 'disabled'">
                    <a class="page-link bg-dark border-secondary text-white" 
                       th:href="@{/admin/login-logs(page=${pageResponse.currentPage + 1}, searchEmpId=${searchEmpId}, searchIp=${searchIp})}">다음</a>
                </li>
            </ul>
        </nav>
    </div>
    </div>
</body>
</html>
