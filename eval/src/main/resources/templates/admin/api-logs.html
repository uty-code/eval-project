<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'admin-api-logs', ~{::style}, ~{::script})}">

<head>
    <title>시스템 감사 로그 - EES 사원 평가 시스템</title>
    <style>
        .timeline-item { border-left: 2px solid #495057; padding-left: 20px; position: relative; margin-bottom: 20px; }
        .timeline-item::before { content: ''; position: absolute; left: -6px; top: 0; width: 10px; height: 10px; border-radius: 50%; background-color: #3b82f6; }
        .timeline-item.error::before { background-color: #ef4444; }
        .timeline-date { font-size: 0.85rem; color: #adb5bd; }
        .timeline-json { font-size: 0.8rem; max-height: 200px; overflow-y: auto; background-color: #212529 !important; border-color: #495057 !important; color: #e9ecef !important;}
        
        .modal-content.dark-theme { background-color: #1e1e2d; color: #fff; }
        .modal-header.dark-theme { border-bottom: 1px solid #323248; }
        .offcanvas.dark-theme { background-color: #1e1e2d; color: #fff; }
        .offcanvas-header.dark-theme { border-bottom: 1px solid #323248; }
    </style>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" data-bs-theme="dark">

        <!-- Page Header -->
        <div class="row align-items-center mb-4">
            <div class="col">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-2">
                        <li class="breadcrumb-item">
                            <a th:href="@{/}" class="text-primary text-decoration-none">대시보드</a>
                        </li>
                        <li class="breadcrumb-item active text-muted">시스템 감사 로그</li>
                    </ol>
                </nav>
                <h1 class="fw-bold fs-3 mb-0">
                    <i class="bi bi-shield-check me-2 text-primary"></i>시스템 감사 로그 (Audit)
                </h1>
            </div>
        </div>

        <!-- 검색 필터 영역 -->
        <div class="ees-card p-4 mb-4">
            <form th:action="@{/admin/api-logs}" method="get" id="searchForm" class="row g-3">
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-semibold">시작일</label>
                    <input type="date" class="form-control bg-dark border-secondary text-white" name="startDate" th:value="${params.startDate}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-semibold">종료일</label>
                    <input type="date" class="form-control bg-dark border-secondary text-white" name="endDate" th:value="${params.endDate}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-semibold">사번 (User ID)</label>
                    <div class="input-group">
                        <input type="text" id="apiLogEmpId" class="form-control bg-dark border-secondary text-white" name="empId" th:value="${params.empId}" placeholder="사번 입력">
                        <button type="button" class="btn btn-outline-info" onclick="window.openEmployeeSelector(emp => document.getElementById('apiLogEmpId').value = emp.id)" title="사원 검색"><i class="bi bi-person-badge"></i></button>
                    </div>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-semibold">타겟 ID (대상)</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" name="targetId" th:value="${params.targetId}" placeholder="매핑ID, 평가ID 등">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-semibold">접속 IP</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" name="ipAddress" th:value="${params.ipAddress}" placeholder="192.168.x.x">
                </div>
                
                <div class="col-md-3">
                    <label class="form-label text-muted small fw-semibold">Trace ID</label>
                    <input type="text" class="form-control bg-dark border-secondary text-white" name="traceId" th:value="${params.traceId}" placeholder="UUID">
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-semibold">상태 결과</label>
                    <select class="form-select bg-dark border-secondary text-white" name="resultCode">
                        <option value="">전체</option>
                        <option value="SUCCESS" th:selected="${params.resultCode == 'SUCCESS'}">성공 (SUCCESS)</option>
                        <option value="ERROR" th:selected="${params.resultCode == 'ERROR'}">에러 (ERROR)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label text-muted small fw-semibold">HTTP 메서드</label>
                    <select class="form-select bg-dark border-secondary text-white" name="httpMethod">
                        <option value="">전체</option>
                        <option value="GET" th:selected="${params.httpMethod == 'GET'}">GET</option>
                        <option value="POST" th:selected="${params.httpMethod == 'POST'}">POST</option>
                        <option value="PUT" th:selected="${params.httpMethod == 'PUT'}">PUT</option>
                        <option value="DELETE" th:selected="${params.httpMethod == 'DELETE'}">DELETE</option>
                    </select>
                </div>

                <div class="col-md-5 d-flex align-items-end gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-search me-1"></i>검색</button>
                    <a th:href="@{/admin/api-logs}" class="btn btn-outline-secondary">초기화(오늘)</a>
                    <button type="button" class="btn btn-outline-danger" onclick="searchErrorsOnly()">오늘 에러만 보기</button>
                </div>
            </form>
        </div>

        <!-- 로그 목록 -->
        <div class="ees-card p-4">
            <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold mb-0">
                    <i class="bi bi-table me-2 text-primary"></i>상세 이력
                </h5>
            </div>

            <div class="table-responsive">
                <table class="ees-table">
                    <thead>
                        <tr style="border-color:rgba(255,255,255,0.1);">
                            <th class="text-muted small fw-semibold">시간</th>
                            <th class="text-muted small fw-semibold">사번</th>
                            <th class="text-muted small fw-semibold">메서드</th>
                            <th class="text-muted small fw-semibold">API URL</th>
                            <th class="text-muted small fw-semibold">상태</th>
                            <th class="text-muted small fw-semibold">타겟 ID</th>
                            <th class="text-muted small fw-semibold">Trace ID</th>
                            <th class="text-muted small fw-semibold">IP</th>
                            <th class="text-muted small fw-semibold text-center">상세</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(logs)}">
                            <td colspan="9" class="text-center text-muted py-5">조회된 로그가 없습니다.</td>
                        </tr>
                        <tr th:each="log : ${logs}" style="border-color:rgba(255,255,255,0.06);">
                            <td class="small text-white-50" th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm:ss')}"></td>
                            <td class="small" th:text="${log.createdBy != null ? log.createdBy : '비로그인'}"></td>
                            <td>
                                <span class="ees-badge" 
                                      th:classappend="${log.httpMethod == 'GET' ? 'ees-badge-multi' : (log.httpMethod == 'POST' ? 'ees-badge-self' : 'ees-badge-performance')}"
                                      th:text="${log.httpMethod}">POST</span>
                            </td>
                            <td class="small font-monospace text-truncate" style="max-width: 200px;" th:text="${log.apiUrl}"></td>
                            <td>
                                <span th:if="${log.resultCode == 'SUCCESS'}" class="ees-badge ees-badge-self"><i class="bi bi-check-circle-fill"></i> 성공</span>
                                <span th:unless="${log.resultCode == 'SUCCESS'}" class="ees-badge" style="background: rgba(239, 68, 68, 0.1); color: #ef4444;" th:text="${log.resultCode}"></span>
                            </td>
                            <td class="small text-white-50" th:text="${log.targetId ?: '-'}"></td>
                            <td>
                                <a href="javascript:void(0)" class="text-primary text-truncate d-inline-block text-decoration-none fw-bold font-monospace small" 
                                   style="max-width: 120px;" 
                                   th:onclick="showTraceTimeline([[${log.traceId}]])" 
                                   th:title="'전체 타임라인 보기: ' + ${log.traceId}" 
                                   th:text="${log.traceId}">UUID</a>
                            </td>
                            <td class="small text-white-50 font-monospace" th:text="${log.ipAddress}"></td>
                            <td class="text-center">
                                <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" 
                                        th:onclick="showDetailModal([[${log.requestContent}]], [[${log.responseContent}]])">
                                    <i class="bi bi-file-text"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <nav th:if="${pageResponse.totalPages > 1}" class="mt-4" aria-label="Page navigation">
                <ul class="pagination justify-content-center pagination-sm">
                    <!-- 이전 페이지 -->
                    <li class="page-item" th:classappend="${pageResponse.currentPage == 1} ? 'disabled'">
                        <a class="page-link bg-dark border-secondary text-white" 
                           th:href="@{/admin/api-logs(
                               page=${pageResponse.currentPage - 1},
                               startDate=${params.startDate}, endDate=${params.endDate},
                               empId=${params.empId}, targetId=${params.targetId},
                               ipAddress=${params.ipAddress}, traceId=${params.traceId},
                               resultCode=${params.resultCode}, httpMethod=${params.httpMethod}
                           )}">이전</a>
                    </li>
                    
                    <!-- 페이지 번호 -->
                    <li class="page-item" 
                        th:each="pageNum : ${#numbers.sequence(
                            pageResponse.currentPage - 5 < 1 ? 1 : pageResponse.currentPage - 5,
                            pageResponse.currentPage + 5 > pageResponse.totalPages ? pageResponse.totalPages : pageResponse.currentPage + 5)}"
                        th:classappend="${pageNum == pageResponse.currentPage} ? 'active'">
                        <a class="page-link border-secondary"
                           th:classappend="${pageNum == pageResponse.currentPage} ? 'bg-primary text-white border-primary' : 'bg-dark text-white'"
                           th:href="@{/admin/api-logs(
                               page=${pageNum},
                               startDate=${params.startDate}, endDate=${params.endDate},
                               empId=${params.empId}, targetId=${params.targetId},
                               ipAddress=${params.ipAddress}, traceId=${params.traceId},
                               resultCode=${params.resultCode}, httpMethod=${params.httpMethod}
                           )}"
                           th:text="${pageNum}">1</a>
                    </li>
                    
                    <!-- 다음 페이지 -->
                    <li class="page-item" th:classappend="${pageResponse.currentPage == pageResponse.totalPages} ? 'disabled'">
                        <a class="page-link bg-dark border-secondary text-white" 
                           th:href="@{/admin/api-logs(
                               page=${pageResponse.currentPage + 1},
                               startDate=${params.startDate}, endDate=${params.endDate},
                               empId=${params.empId}, targetId=${params.targetId},
                               ipAddress=${params.ipAddress}, traceId=${params.traceId},
                               resultCode=${params.resultCode}, httpMethod=${params.httpMethod}
                           )}">다음</a>
                    </li>
                </ul>
            </nav>
        </div>

        <!-- 상세 내용 모달 -->
        <div class="modal fade" id="logDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg">
                <div class="modal-content dark-theme">
                    <div class="modal-header dark-theme">
                        <h5 class="modal-title fw-bold"><i class="bi bi-file-earmark-code me-2 text-primary"></i>로그 상세 페이로드</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body p-4">
                        <h6 class="text-muted fw-semibold mb-2">Request Content (파라미터)</h6>
                        <pre><code id="reqContent" class="language-json p-3 rounded d-block timeline-json shadow-sm"></code></pre>
                        <div class="my-4"></div>
                        <h6 class="text-muted fw-semibold mb-2">Response Content (결과/오류)</h6>
                        <pre><code id="resContent" class="language-json p-3 rounded d-block timeline-json shadow-sm"></code></pre>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trace ID 타임라인 오프캔버스 -->
        <div class="offcanvas offcanvas-end dark-theme" tabindex="-1" id="traceOffcanvas" style="width: 600px;">
            <div class="offcanvas-header dark-theme">
                <h5 class="offcanvas-title fw-bold">
                    <i class="bi bi-diagram-3 me-2 text-primary"></i>Trace 타임라인
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            <div class="offcanvas-body">
                <div class="mb-4 bg-dark bg-opacity-25 p-3 rounded border border-secondary border-opacity-25">
                    <div class="text-muted small fw-semibold mb-1">Trace ID</div>
                    <div id="offcanvasTraceId" class="fw-bold text-break text-primary font-monospace"></div>
                </div>
                
                <!-- 로딩 스피너 -->
                <div id="timelineLoading" class="text-center py-5 d-none">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <div class="text-muted small mt-2">타임라인 분석 중...</div>
                </div>

                <!-- 타임라인 컨텐츠 -->
                <div id="timelineContent" class="timeline-container position-relative px-2">
                    <!-- JS로 동적 생성됨 -->
                </div>
            </div>
        </div>

    </div>

    <script>
        function searchErrorsOnly() {
            const form = document.getElementById('searchForm');
            form.elements['resultCode'].value = 'ERROR';
            form.submit();
        }

        function showDetailModal(req, res) {
            try {
                document.getElementById('reqContent').textContent = req && req !== '{}' ? JSON.stringify(JSON.parse(req), null, 2) : (req || '없음');
            } catch (e) {
                document.getElementById('reqContent').textContent = req;
            }
            
            try {
                document.getElementById('resContent').textContent = res ? JSON.stringify(JSON.parse(res), null, 2) : (res || '없음');
            } catch (e) {
                document.getElementById('resContent').textContent = res;
            }

            var myModal = new bootstrap.Modal(document.getElementById('logDetailModal'));
            myModal.show();
        }

        async function showTraceTimeline(traceId) {
            if (!traceId) {
                alert("Trace ID가 없습니다.");
                return;
            }

            document.getElementById('offcanvasTraceId').textContent = traceId;
            const contentDiv = document.getElementById('timelineContent');
            const loadingDiv = document.getElementById('timelineLoading');
            
            contentDiv.innerHTML = '';
            loadingDiv.classList.remove('d-none');
            
            var offcanvas = new bootstrap.Offcanvas(document.getElementById('traceOffcanvas'));
            offcanvas.show();

            try {
                const response = await fetch(`/admin/api-logs/api/trace/${traceId}`);
                if (!response.ok) throw new Error('네트워크 응답 오류');
                const logs = await response.json();
                
                // 시간순(오름차순)으로 보기 위해 배열 뒤집기
                logs.reverse();

                let html = '';
                logs.forEach(log => {
                    const isError = log.resultCode !== 'SUCCESS';
                    const dateStr = log.createdAt ? log.createdAt.replace('T', ' ').substring(0, 19) : '';
                    const methodBadge = log.httpMethod === 'GET' ? 'ees-badge-multi' : (log.httpMethod === 'POST' ? 'ees-badge-self' : 'ees-badge-performance');
                    
                    let reqJson = log.requestContent || '없음';
                    try { if (reqJson !== '없음' && reqJson !== '{}') reqJson = JSON.stringify(JSON.parse(reqJson), null, 2); } catch(e){}
                    
                    let resJson = log.responseContent || '없음';
                    try { if (resJson !== '없음') resJson = JSON.stringify(JSON.parse(resJson), null, 2); } catch(e){}

                    html += `
                        <div class="timeline-item ${isError ? 'error' : ''}">
                            <div class="timeline-date">${dateStr}</div>
                            <div class="d-flex align-items-center gap-2 mb-2 mt-1">
                                <span class="ees-badge ${methodBadge}">${log.httpMethod}</span>
                                <span class="ees-badge" style="${isError ? 'background: rgba(239, 68, 68, 0.1); color: #ef4444;' : 'background: rgba(16, 185, 129, 0.1); color: #10b981;'}">${log.resultCode}</span>
                                <span class="fw-bold font-monospace small text-white">${log.apiUrl}</span>
                            </div>
                            <div class="card border-0 shadow-sm mt-2" style="background-color: rgba(255,255,255,0.02);">
                                <div class="card-body p-3 border border-secondary border-opacity-25 rounded">
                                    <div class="mb-3">
                                        <div class="fw-semibold small text-muted mb-2"><i class="bi bi-box-arrow-in-right me-1"></i>Request</div>
                                        <pre class="m-0 p-2 rounded timeline-json border-0"><code>${reqJson}</code></pre>
                                    </div>
                                    <div>
                                        <div class="fw-semibold small text-muted mb-2"><i class="bi bi-box-arrow-left me-1"></i>Response</div>
                                        <pre class="m-0 p-2 rounded timeline-json border-0"><code>${resJson}</code></pre>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                if (logs.length === 0) {
                    html = '<div class="text-center text-muted py-4"><i class="bi bi-inbox fs-1 d-block mb-2"></i>해당 Trace ID의 기록이 없습니다.</div>';
                }
                contentDiv.innerHTML = html;
            } catch (error) {
                contentDiv.innerHTML = `<div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger"><i class="bi bi-exclamation-triangle me-2"></i>데이터를 불러오는데 실패했습니다: ${error.message}</div>`;
            } finally {
                loadingDiv.classList.add('d-none');
            }
        }
    </script>
</body>
</html>
