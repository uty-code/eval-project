<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'multi-dimensional-eval', ~{::extraStyles}, ~{})}">

<head>
    <title>다면 평가 - EES</title>
    <th:block th:fragment="extraStyles">
        <style>
            /* ===== 필터 바 ===== */
            .filter-bar select,
            .filter-bar input {
                background: rgba(255, 255, 255, .06);
                border: 1px solid rgba(255, 255, 255, .12);
                color: #cbd5e1;
                font-size: .85rem;
                padding: .4rem .7rem;
                border-radius: 20px;
                outline: none;
            }

            .filter-bar select:focus,
            .filter-bar input:focus {
                border-color: rgba(99, 102, 241, .5);
            }

            .btn-search {
                background: linear-gradient(90deg, #6366f1, #a855f7);
                color: #fff;
                border: none;
                padding: .45rem 1.2rem;
                border-radius: 20px;
                font-size: .8rem;
                font-weight: 700;
                cursor: pointer;
                transition: all .2s;
            }

            .btn-search:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 15px rgba(99, 102, 241, .4);
            }

            /* ===== 테이블 ===== */
            .result-table-wrap {
                padding: 1rem 1.5rem 1.5rem;
                overflow-x: auto;
            }

            .result-table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
                font-size: .78rem;
                border-top: 1px solid rgba(255, 255, 255, .35);
                border-left: 1px solid rgba(255, 255, 255, .35);
                border-right: 1px solid rgba(255, 255, 255, .35);
                min-width: 900px;
                table-layout: fixed;
            }

            .result-table thead th {
                padding: .65rem .5rem;
                text-align: center;
                font-weight: 600;
                color: rgba(255, 255, 255, .7);
                white-space: nowrap;
                border-bottom: 1px solid rgba(255, 255, 255, .35);
                background: rgba(255, 255, 255, .02);
            }

            .th-group {
                font-size: .8rem;
                font-weight: 700;
                letter-spacing: .5px;
            }

            .th-group-info {
                color: rgba(255, 255, 255, .5);
            }

            .th-group-action {
                color: #f59e0b !important;
            }

            .result-table tbody td {
                padding: .85rem .7rem;
                text-align: center;
                color: rgba(255, 255, 255, .8);
                border-bottom: 1px solid rgba(255, 255, 255, .35);
                vertical-align: middle;
            }

            .result-table tbody tr:hover {
                background: rgba(255, 255, 255, .03);
            }

            .emp-name {
                color: #a855f7;
                font-weight: 700;
            }

            /* ===== 상태 배지 ===== */
            .status-badge {
                font-size: .65rem;
                padding: .3rem .6rem;
                border-radius: 12px;
                font-weight: 600;
                white-space: nowrap;
                display: inline-block;
            }

            .status-done {
                background: rgba(16, 185, 129, .15);
                color: #34d399;
                border: 1px solid rgba(16, 185, 129, .3);
            }

            .status-prog {
                background: rgba(56, 189, 248, .15);
                color: #7dd3fc;
                border: 1px solid rgba(56, 189, 248, .3);
            }

            .status-wait {
                background: rgba(245, 158, 11, .15);
                color: #fcd34d;
                border: 1px solid rgba(245, 158, 11, .3);
            }

            /* ===== 버튼 배지 ===== */
            .action-btn {
                font-size: .75rem;
                padding: .35rem .8rem;
                border-radius: 6px;
                font-weight: 600;
                border: none;
                transition: all 0.2s;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 0.3rem;
            }

            .action-primary {
                background: linear-gradient(90deg, #6366f1, #a855f7);
                color: #fff;
                box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
            }

            .action-primary:hover {
                background: linear-gradient(90deg, #4f46e5, #9333ea);
                color: #fff;
                transform: translateY(-1px);
            }

            .action-view {
                background-color: #475569;
                color: #fff;
            }

            .action-view:hover {
                background-color: #334155;
            }

            .action-locked {
                background-color: #475569;
                color: #fff;
            }

            .action-waiting {
                background-color: #4b5563;
                color: #d1d5db;
                cursor: not-allowed;
                opacity: 0.8;
            }

            .pagination-container {
                display: flex;
                justify-content: center;
                margin-top: 1.5rem;
                gap: 0.25rem;
            }

            /* 주요 정보 열 너비 고정 (간격 일정하게 유지) */
            .col-period { width: 120px; }
            .col-dept   { width: 120px; }
            .col-title  { width: 100px; }
            .col-empid  { width: 100px; }
            .col-name   { width: 100px; }

            .result-table th, .result-table td {
                padding-left: 0.5rem !important;
                padding-right: 0.5rem !important;
            }
        </style>
    </th:block>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" th:fragment="content">
        <!-- Re-include styles for HTMX swaps -->
        <th:block th:replace="~{::extraStyles}"></th:block>

        <!-- 상단 헤더 & 차수 선택 영역 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-white fs-3 mb-1"><i class="bi bi-people-fill text-primary me-2"></i>다면 평가</h1>
                <p class="text-muted mb-0 small">배정된 부서장/상급자 평가를 진행해주세요.</p>
            </div>
            <div></div>
        </div>

        <!-- 에러/성공 메시지 영역 -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert"
            style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 0.75rem;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div th:text="${errorMessage}"></div>
        </div>

        <div th:if="${successMessage}" class="alert d-flex align-items-center mb-3" role="alert"
            style="background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; border-radius: 0.75rem;">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <div th:text="${successMessage}"></div>
        </div>

        <!-- 정보 메시지 -->
        <div th:if="${infoMessage}" class="ees-card p-4 text-center mb-4" style="color:rgba(255,255,255,.5)">
            <i class="bi bi-info-circle me-1"></i> <span th:text="${infoMessage}"></span>
        </div>

        <!-- ━━━━ 다면평가 리스트 영역 (HTMX 갱신 영역) ━━━━ -->
        <div id="eval-table-container">

            <div th:if="${selectedPeriod != null && selectedPeriod.statusCode() == 'PLANNED'}" class="ees-card p-5 text-center text-muted">
                <i class="bi bi-clock-history fs-1 mb-3 d-block opacity-25 text-info"></i>
                <h5 class="fw-bold text-white mb-2">다면평가 준비 중</h5>
                <p class="mb-0">평가가 시작되면 대상 리스트가 활성화됩니다.</p>
            </div>

            <div th:if="${selectedPeriod == null || selectedPeriod.statusCode() != 'PLANNED'}">
                <!-- 필터 섹션 -->
                <div class="ees-card mb-4 p-3">
                    <form id="filterForm" hx-get="/eval/multi-dimensional" hx-target="#eval-table-container"
                        hx-select="#eval-table-container" hx-swap="outerHTML" hx-push-url="true" hx-sync="this:replace">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-3">
                                <label class="form-label text-muted small fw-semibold">평가 차수</label>
                                    <select name="periodId"
                                            class="form-select bg-transparent border-secondary border-opacity-50 fw-bold"
                                            style="color: #fff; font-size: 0.85rem; border-radius: 8px;">
                                        <option value="">전체 차수 통합</option>
                                        <option th:each="p : ${periods}" th:value="${p.periodId()}"
                                                th:text="${'[' + p.periodYear() + '] ' + p.periodName()}"
                                                th:selected="${selectedPeriod?.periodId() == p.periodId()}"></option>
                                    </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-muted small fw-semibold">부서 필터</label>
                                <select name="filterDeptId"
                                    class="form-select bg-transparent border-secondary border-opacity-50"
                                    style="color: #cbd5e1; font-size: 0.85rem; border-radius: 8px;">
                                    <option value="">전체 부서</option>
                                    <option th:each="d : ${departments}" th:value="${d.deptId()}"
                                        th:text="${d.deptName()}" th:selected="${filterDeptId == d.deptId()}"></option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <label class="form-label text-muted small fw-semibold">평가 상태</label>
                                <select name="filterStatus"
                                    class="form-select bg-transparent border-secondary border-opacity-50"
                                    style="color: #cbd5e1; font-size: 0.85rem; border-radius: 8px;">
                                    <option value="">전체 상태</option>
                                    <option value="SUBMITTED" th:selected="${filterStatus == 'SUBMITTED'}">평가 완료
                                    </option>
                                    <option value="IN_PROGRESS" th:selected="${filterStatus == 'IN_PROGRESS'}">평가 진행중
                                    </option>
                                    <option value="WAITING" th:selected="${filterStatus == 'WAITING'}">평가 대기</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label text-muted small fw-semibold">성명 / 사번 검색</label>
                                <input type="text" name="keyword"
                                    class="form-control bg-transparent border-secondary border-opacity-50 text-white"
                                    placeholder="이름 또는 사번 입력" th:value="${keyword}"
                                    style="font-size: 0.85rem; border-radius: 8px;">
                            </div>
                            <div class="col-md-2 d-flex gap-2">
                                <button type="submit" class="btn-search flex-grow-1" style="height: 38px;">
                                    <i class="bi bi-search me-1"></i>검색
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                <div th:if="${pageData == null || pageData.tasks().isEmpty()}"
                    class="ees-card text-center py-5 border-0 shadow-sm rounded-3 mb-4">
                    <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                    <h5 class="fw-bold text-white">조건에 맞는 다면평가 대상자가 없습니다.</h5>
                </div>

                <!-- 테이블 영역 -->
                <div th:if="${pageData != null && !pageData.tasks().isEmpty()}" class="ees-card mb-5 mt-0">
                    <div class="result-table-wrap">
                        <table class="result-table">
                            <thead>
                                <tr>
                                    <th class="col-period" style="width: 12.2%;">평가 차수</th>
                                    <th class="col-dept" style="width: 16.3%;">부서명</th>
                                    <th class="col-title" style="width: 8.2%;">직책</th>
                                    <th class="col-empid" style="width: 8.2%;">사번</th>
                                    <th class="col-name" style="width: 10.2%; border-right: 1px solid rgba(255, 255, 255, .35);">성명</th>
                                    <th style="width: 18.4%; border-right: 1px solid rgba(255, 255, 255, .35);">관계</th>
                                    <th style="width: 9.2%; border-right: 1px solid rgba(255, 255, 255, .35);">다면 평가</th>
                                    <th style="width: 8.2%; border-right: 1px solid rgba(255, 255, 255, .35);">상태</th>
                                    <th style="width: 9.1%;">진행</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="r : ${pageData.tasks()}">
                                    <td class="small text-muted col-period text-center" th:text="${r.periodName()}">2024 상반기</td>
                                    <td class="col-dept" th:text="${r.deptName()}">-</td>
                                    <td class="col-title" th:text="${r.titleName()}">-</td>
                                    <td class="col-empid" th:text="${r.empId()}">-</td>
                                    <td class="emp-name col-name" style="border-right: 1px solid rgba(255, 255, 255, .35);" th:text="${r.name()}">-</td>
                                    <td style="border-right: 1px solid rgba(255, 255, 255, .35);" th:text="${r.relationName()}">부서원→부서장</td>
                                    <td class="fw-bold" style="color: #a855f7; border-right: 1px solid rgba(255, 255, 255, .35);">
                                        <span th:if="${r.score() != null}"
                                            th:text="${#numbers.formatDecimal(r.score(), 1, 1)}">0.0</span>
                                        <span th:if="${r.score() == null}">-</span>
                                    </td>
                                    <td style="border-right: 1px solid rgba(255, 255, 255, .35);">
                                        <span class="status-badge"
                                            th:classappend="${r.statusType().name() == 'SUBMITTED' ? 'status-done' : (r.statusType().name() == 'IN_PROGRESS' ? 'status-prog' : 'status-wait')}"
                                            th:text="${r.statusType().name() == 'SUBMITTED' ? '완료' : (r.statusType().name() == 'IN_PROGRESS' ? '진행중' : '대기')}">-</span>
                                    </td>
                                    <td>
                                        <!-- 자가평가 대기중 -->
                                        <button th:if="${r.ctaType().name() == 'WAITING_SELF'}"
                                            class="action-btn action-waiting" disabled>
                                            <i class="bi bi-hourglass-split"></i> 대기중
                                        </button>

                                        <!-- 잠금됨 / 기간종료 (조회 모드) -->
                                        <a th:if="${r.ctaType().name() == 'LOCKED'}" href="#"
                                            class="action-btn action-view"
                                            th:attr="hx-get=@{/eval/multi-dimensional/form(mappingId=${r.mappingId()})}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true" hx-sync="body:replace">
                                            <i class="bi bi-search"></i> 조회
                                        </a>

                                        <!-- 평가 진행/수정 -->
                                        <a th:if="${r.ctaType().name() == 'EDIT'}" href="#"
                                            class="action-btn action-primary"
                                            th:attr="hx-get=@{/eval/multi-dimensional/form(mappingId=${r.mappingId()})}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true" hx-sync="body:replace">
                                            <i class="bi bi-pencil-square"></i> <span
                                                th:text="${r.statusType().name() == 'SUBMITTED' ? '수정' : '진행'}"></span>
                                        </a>

                                        <!-- 조회 -->
                                        <a th:if="${r.ctaType().name() == 'VIEW'}" href="#"
                                            class="action-btn action-view"
                                            th:attr="hx-get=@{/eval/multi-dimensional/form(mappingId=${r.mappingId()})}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true" hx-sync="body:replace">
                                            <i class="bi bi-search"></i> 조회
                                        </a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- 페이징네이션 -->
                    <div th:if="${pageData.totalPages() > 1}" class="pagination-container pb-4">
                        <button class="btn btn-sm btn-outline-secondary text-white border-0"
                            th:classappend="${!pageData.hasPrevious()} ? 'disabled'"
                            th:attr="hx-get=@{/eval/multi-dimensional(periodId=${selectedPeriod?.periodId()}, filterDeptId=${filterDeptId}, filterStatus=${filterStatus}, keyword=${keyword}, page=${pageData.currentPage() - 1})}"
                            hx-target="#eval-table-container" hx-select="#eval-table-container" hx-swap="outerHTML"
                            hx-push-url="true" hx-sync="this:replace">
                            <i class="bi bi-chevron-left"></i>
                        </button>

                        <button th:each="i : ${#numbers.sequence(1, pageData.totalPages())}"
                            th:class="${i == pageData.currentPage()} ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-secondary text-white border-0'"
                            th:text="${i}"
                            th:attr="hx-get=@{/eval/multi-dimensional(periodId=${selectedPeriod?.periodId()}, filterDeptId=${filterDeptId}, filterStatus=${filterStatus}, keyword=${keyword}, page=${i})}"
                            hx-target="#eval-table-container" hx-select="#eval-table-container" hx-swap="outerHTML"
                            hx-push-url="true" hx-sync="this:replace">
                        </button>

                        <button class="btn btn-sm btn-outline-secondary text-white border-0"
                            th:classappend="${!pageData.hasNext()} ? 'disabled'"
                            th:attr="hx-get=@{/eval/multi-dimensional(periodId=${selectedPeriod?.periodId()}, filterDeptId=${filterDeptId}, filterStatus=${filterStatus}, keyword=${keyword}, page=${pageData.currentPage() + 1})}"
                            hx-target="#eval-table-container" hx-select="#eval-table-container" hx-swap="outerHTML"
                            hx-push-url="true" hx-sync="this:replace">
                            <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
