<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'multi-dimensional-eval', ~{::extraStyles}, ~{})}">

<head>
    <title>다면 평가 - EES</title>
    <th:block th:fragment="extraStyles">
        <style>
            .eval-list-item {
                display: flex;
                align-items: center;
                padding: 18px 24px;
                border-bottom: 1px solid var(--glass-border);
                transition: background-color 0.2s ease;
            }

            .eval-list-item:last-child {
                border-bottom: none;
            }

            .eval-list-item:hover {
                background-color: rgba(255, 255, 255, 0.05);
            }

            .eval-name {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--text-main);
                min-width: 140px;
            }

            .badge-dept {
                background-color: var(--surface-light);
                color: var(--text-main);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 6px;
                margin-right: 16px;
                border: 1px solid var(--glass-border);
            }

            .badge-status {
                background-color: rgba(245, 158, 11, 0.2);
                color: #fbd38d;
                border: 1px solid rgba(245, 158, 11, 0.3);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 6px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
        </style>
    </th:block>
</head>
<body>
    <div id="page-content" class="container-fluid py-4" th:fragment="content">
        <!-- Re-include styles for HTMX swaps -->
        <th:block th:replace="~{::extraStyles}"></th:block>

        <!-- 상단 헤더 & 차수 선택 영역 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-white fs-3 mb-1"><i class="bi bi-people-fill text-info me-2"></i>다면 평가</h1>
                <p class="text-muted mb-0 small">배정된 부서장/상급자 평가를 진행해주세요.</p>
            </div>
            <div>
                <form th:action="@{/eval/multi-dimensional}" method="get"
                    class="d-inline-flex gap-2 align-items-center bg-dark p-2 rounded-pill shadow-sm"
                    style="border: 1px solid var(--glass-border);">
                    <select name="periodId"
                        class="form-select form-select-sm bg-transparent text-white border-0 fw-bold"
                        onchange="this.form.submit()" style="width: 200px; box-shadow: none;">
                        <option class="bg-dark" th:each="p : ${periods}" th:value="${p.periodId()}"
                            th:text="${'[' + p.periodYear() + '] ' + p.periodName()}"
                            th:selected="${selectedPeriod?.periodId() == p.periodId()}">차수 선택</option>
                    </select>
                </form>
            </div>
        </div>

        <!-- 에러/성공 메시지 영역 -->
        <div th:if="${errorMessage}" class="alert alert-danger mb-3" role="alert"
            style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 0.75rem;">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${errorMessage}"></span>
        </div>
        <div th:if="${successMessage}" class="alert alert-success mb-3" role="alert"
            style="background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: #86efac; border-radius: 0.75rem;">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <!-- 정보 메시지 -->
        <div th:if="${infoMessage}" class="ees-card p-4 text-center mb-4" style="color:rgba(255,255,255,.5)">
            <i class="bi bi-info-circle me-1"></i> <span th:text="${infoMessage}"></span>
        </div>

        <div th:if="${selectedPeriod != null}">

            <div th:if="${selectedPeriod.statusCode() != 'PLANNED'}">
                <div th:if="${tasks == null || tasks.isEmpty()}" class="ees-card text-center py-5">
                    <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                    <h5 class="fw-bold text-white">다면평가 대상자가 없습니다.</h5>
                </div>

                <div th:if="${tasks != null && !tasks.isEmpty()}" class="ees-card">
                    <div th:each="task : ${tasks}" class="eval-list-item">
                        <div class="eval-name" th:text="${task.evaluateeName()}">부서장 이름</div>
                        <div class="badge-dept">부서장</div>
                        
                        <!-- 제출 여부 배지 -->
                        <div th:if="${!submittedMap.getOrDefault(task.mappingId(), false)}" class="badge-status">
                            <i class="bi bi-hourglass-split"></i> 평가 대기
                        </div>
                        <div th:if="${submittedMap.getOrDefault(task.mappingId(), false)}" class="badge-status"
                            style="background:rgba(34,197,94,0.15);color:#86efac;border-color:rgba(34,197,94,0.3);">
                            <i class="bi bi-check-circle-fill"></i> 평가 완료
                        </div>

                        <div class="flex-grow-1"></div>
                        <div>
                            <!-- 1. 평가 잠금 상태인 경우 -->
                            <button th:if="${lockMap != null && lockMap.getOrDefault(task.mappingId(), false)}"
                                class="badge-status"
                                style="background-color: #991b1b; cursor: not-allowed; border: none; padding: 8px 16px;">
                                <i class="bi bi-lock-fill"></i> 평가 잠김
                            </button>

                            <!-- 2. 자가평가가 완료된 경우 (잠금 상태 아닐 때) -->
                            <a th:if="${(lockMap == null || !lockMap.getOrDefault(task.mappingId(), false)) && evaluateeSelfSubmittedMap != null && evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false)}"
                                href="#" class="btn ees-btn-glass-primary btn-sm"
                                th:attr="hx-get=@{/eval/multi-dimensional/form(mappingId=${task.mappingId()})}"
                                hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                hx-push-url="true">
                                <i class="bi bi-pencil-square"></i> 
                                <span th:text="${submittedMap.getOrDefault(task.mappingId(), false)} ? '평가 수정' : '평가 작성'"></span>
                            </a>

                            <!-- 3. 자가평가 대기중 (잠금 상태 아닐 때) -->
                            <button th:if="${(lockMap == null || !lockMap.getOrDefault(task.mappingId(), false)) && (evaluateeSelfSubmittedMap == null || !evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false))}"
                                class="badge-status"
                                style="background-color: #4b5563; cursor: not-allowed; opacity: 0.7; border: none; padding: 8px 16px;">
                                <i class="bi bi-lock-fill"></i> 자가평가 대기중
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 평가 시작 전 화면 -->
            <div th:if="${selectedPeriod.statusCode() == 'PLANNED'}" class="ees-card p-5 text-center text-muted">
                <i class="bi bi-clock-history fs-1 mb-3 d-block opacity-25 text-info"></i>
                <h5 class="fw-bold text-white mb-2">다면평가 준비 중</h5>
                <p class="mb-0">평가가 시작되면 대상 리스트가 활성화됩니다.</p>
            </div>
        </div>
    </div>
</body>

</html>
