<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'elements', ~{}, ~{::script})}">

<head>
    <title>평가 요소 관리 - EES</title>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" th:fragment="content">
        <!-- 알림 메시지 (Toast/Alert) -->
        <div th:if="${successMessage}"
            class="alert alert-success alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-check-circle-fill fs-4 me-2"></i>
            <div th:text="${successMessage}" class="fw-bold">성공 메시지</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${errorMessage}"
            class="alert alert-danger alert-dismissible fade show d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-exclamation-triangle-fill fs-4 me-2"></i>
            <div th:text="${errorMessage}" class="fw-bold">오류 메시지</div>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Title Section -->
        <div class="row align-items-center mb-4">
            <div class="col-md-4">
                <h1 class="fw-bold fs-3 mb-1">평가요소 관리</h1>
                <p class="text-muted mb-0">평가 차수별 성과 및 역량 평가의 항목과 가중치를 구성하고 관리합니다.</p>
            </div>
            <div class="col-md-8 text-md-end">
                <form th:action="@{/eval/elements}" method="get"
                    hx-get="/eval/elements" hx-target="#page-content"
                    hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true"
                    hx-indicator="#global-loader"
                    class="d-inline-flex gap-2 align-items-center flex-wrap justify-content-end" id="filterForm">
                    
                    <label class="text-muted small text-nowrap">차수 선택:</label>
                    <select name="periodId" class="form-select form-select-sm bg-dark text-white border-secondary"
                        style="width: 200px;" onchange="this.form.requestSubmit()">
                        <option th:each="p : ${periods}" th:value="${p.periodId()}" 
                            th:text="${'[' + p.periodYear() + '] ' + p.periodName()}"
                            th:selected="${selectedPeriod?.periodId() == p.periodId()}"></option>
                    </select>

                    <label class="text-muted small text-nowrap ms-2">부서:</label>
                    <select name="deptId" class="form-select form-select-sm bg-dark text-white border-secondary"
                        style="width: 150px;" onchange="this.form.requestSubmit()">
                        <option value="">전사 공통</option>
                        <th:block th:each="d : ${departments}">
                            <option th:if="${d.parentDeptId() == null}" th:value="${d.deptId()}"
                                th:text="'🏢 ' + ${d.deptName()}" th:selected="${selectedDeptId == d.deptId()}"
                                style="font-weight: 700; color: #a5b4fc;">
                            </option>
                            <option th:unless="${d.parentDeptId() == null}" th:value="${d.deptId()}"
                                th:text="'　└ ' + ${d.deptName()}" th:selected="${selectedDeptId == d.deptId()}"
                                style="color: #94a3b8; padding-left: 1.5rem;">
                            </option>
                        </th:block>
                    </select>
                </form>
            </div>
        </div>
        
        <!-- 정보 메시지 -->
        <div th:if="${infoMessage}" class="ees-card p-4 text-center mb-4" style="color:rgba(255,255,255,.5)">
            <i class="bi bi-info-circle me-1"></i> <span th:text="${infoMessage}"></span>
        </div>

        <!-- 수정 불가 알림 배너 -->
        <div th:if="${selectedPeriod != null && editable != null && !editable}" class="alert alert-warning bg-warning bg-opacity-10 border-warning border-opacity-25 text-warning d-flex align-items-center mb-4" role="alert">
            <i class="bi bi-lock-fill fs-5 me-2"></i>
            <div>
                <strong>읽기 전용</strong> &mdash; 평가가 시작된 차수의 평가요소는 변경할 수 없습니다.
            </div>
        </div>

        <th:block th:if="${selectedPeriod != null}">


        <!-- 유형별 가중치 설정 바 -->
        <div class="row g-4 mb-5">
            <div class="col-xl-8">
                <div class="ees-card p-4 h-100">
                    <div class="mb-3">
                        <h5 class="fw-bold mb-1 text-white">부서원(Staff) 가중치 설정</h5>
                        <p class="text-secondary small mb-0">성과와 역량 비중 합계가 100%여야 합니다.</p>
                    </div>
                    <form hx-post="/eval/elements/type-weights" hx-target="#page-content" hx-swap="outerHTML">
                        <input type="hidden" name="periodId" th:value="${selectedPeriod.periodId()}">
                        <input type="hidden" name="deptId" th:value="${selectedDeptId}">
                        <input type="hidden" name="targetRoleCode" value="STAFF">

                        <div class="ees-weight-control-bar shadow-sm">
                            <th:block th:each="weight : ${memberWeights}">
                                <div class="weight-section">
                                    <span class="weight-label me-2" 
                                        th:classappend="${weight.elementTypeCode() == 'PERFORMANCE' ? 'text-performance' : 'text-competency'}"
                                        th:text="${weight.elementTypeCode() == 'PERFORMANCE' ? '성과' : '역량'}">성과</span>
                                    <input type="number" name="weights"
                                        th:value="${#numbers.formatDecimal(weight.weight(), 1, 0)}"
                                        th:id="'weight-' + ${weight.elementTypeCode()}"
                                        class="weight-input weight-input-sync"
                                        min="0" max="100"
                                        th:readonly="${!editable}" th:disabled="${!editable}">
                                    <span class="weight-unit">%</span>
                                    <input type="hidden" name="types" th:value="${weight.elementTypeCode()}">
                                </div>
                            </th:block>
                            <button th:if="${editable}" type="submit" class="weight-save-btn">
                                <i class="bi bi-check-lg"></i>저장
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-xl-4">
                <div class="ees-card p-4 h-100">
                    <div class="mb-3">
                        <h5 class="fw-bold mb-1 ees-text-gradient">부서장(Leader) 설정</h5>
                        <p class="text-secondary small mb-0">다면평가 100% 고정입니다.</p>
                    </div>
                    <div class="ees-weight-control-bar shadow-sm">
                        <th:block th:each="weight : ${leaderWeights}">
                            <div class="weight-section">
                                <span class="weight-label me-2 text-multi" style="color: #f59e0b;">다면</span>
                                <input type="number" th:value="${#numbers.formatDecimal(weight.weight(), 1, 0)}"
                                    class="weight-input" readonly disabled>
                                <span class="weight-unit">%</span>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div th:classappend="${editable ? 'col-lg-9' : 'col-lg-12'}" class="">
                <div class="ees-card p-4 overflow-hidden">
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <div class="d-flex align-items-center">
                            <div class="icon-box me-3 bg-primary bg-opacity-10 p-2 rounded-3">
                                <i class="bi bi-list-task text-primary fs-5"></i>
                            </div>
                            <div>
                                <h5 class="fw-bold mb-0">등록된 평가 기준(문항)</h5>
                                <p class="text-muted small mb-0">현재 설정된 평가 항목 및 배점 기준입니다.</p>
                            </div>
                        </div>
                        <form th:if="${selectedDeptId != null && editable}" hx-post="/eval/elements/copy-common"
                            hx-target="#page-content" hx-swap="outerHTML"
                            hx-confirm="전사 공통 항목을 현재 부서로 가져오시겠습니까?">
                            <input type="hidden" name="periodId" th:value="${selectedPeriod.periodId()}">
                            <input type="hidden" name="deptId" th:value="${selectedDeptId}">
                            <button type="submit" class="btn ees-btn-glass btn-sm px-3">
                                <i class="bi bi-cloud-download me-1 text-info"></i> 전사공통 불러오기
                            </button>
                        </form>
                    </div>
                    <div class="table-responsive">
                        <table class="ees-table">
                            <thead>
                                <tr>
                                    <th style="width: 15%">유형</th>
                                    <th style="width: 55%">요소명 (지표)</th>
                                    <th class="text-center" style="width: 15%">가중치</th>
                                    <th th:if="${editable}" class="text-center" style="width: 15%">관리</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="el : ${elements}">
                                    <td>
                                        <span th:if="${el.elementTypeCode() == 'PERFORMANCE'}" class="ees-badge ees-badge-performance">성과</span>
                                        <span th:if="${el.elementTypeCode() == 'COMPETENCY'}" class="ees-badge ees-badge-competency">역량</span>
                                        <span th:if="${el.elementTypeCode() == 'MULTI_DIMENSIONAL'}" class="ees-badge ees-badge-multi">다면</span>
                                    </td>
                                    <td>
                                        <div class="fw-bold text-white" th:text="${el.elementName()}">요소명</div>
                                    </td>
                                    <td class="text-center">
                                        <span class="badge bg-dark bg-opacity-50 text-primary border border-primary border-opacity-25 px-3 py-2 rounded-pill" 
                                              th:text="${#numbers.formatDecimal(el.weight(), 1, 0) + '%'}">0%</span>
                                    </td>
                                    <td th:if="${editable}" class="text-center">
                                        <form th:attr="hx-post=@{/eval/elements/{id}/delete(id=${el.elementId()})}"
                                            hx-target="#page-content" hx-swap="outerHTML" hx-confirm="항목을 삭제하시겠습니까?">
                                            <input type="hidden" name="periodId" th:value="${selectedPeriod.periodId()}">
                                            <input type="hidden" name="deptId" th:value="${selectedDeptId}">
                                            <button type="submit" class="btn ees-btn-glass-danger btn-sm rounded-circle p-0" style="width: 32px; height: 32px;">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(elements)}">
                                    <td colspan="4" class="text-center py-5">
                                        <div class="text-muted opacity-50 mb-2">
                                            <i class="bi bi-inbox fs-1"></i>
                                        </div>
                                        <div class="text-muted">등록된 문항이 없습니다.</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div th:if="${editable}" class="col-lg-3">
                <div class="ees-card p-4">
                    <div class="d-flex align-items-center mb-4">
                        <div class="icon-box me-2 bg-primary bg-opacity-10 p-2 rounded-3">
                            <i class="bi bi-plus-circle text-primary"></i>
                        </div>
                        <h5 class="fw-bold mb-0">평가요소 추가</h5>
                    </div>
                    <form hx-post="/eval/elements" hx-target="#page-content" hx-swap="outerHTML" hx-indicator="#global-loader">
                        <input type="hidden" name="periodId" th:value="${selectedPeriod?.periodId()}">
                        <input type="hidden" name="deptId" th:value="${selectedDeptId}">
                        <input type="hidden" name="maxScore" value="100">

                        <div class="mb-4">
                            <label class="form-label small text-muted fw-bold">평가 유형</label>
                            <select name="elementTypeCode" class="form-select ees-form-control ees-form-select" required>
                                <option value="PERFORMANCE">성과 평가</option>
                                <option value="COMPETENCY">역량 평가</option>
                                <option value="MULTI_DIMENSIONAL">다면 평가</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-muted fw-bold">요소명 (지표)</label>
                            <input type="text" name="elementName" class="form-control ees-form-control" placeholder="예: 목표 달성도" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small text-muted fw-bold d-flex justify-content-between">
                                가중치 (%)
                                <span id="remaining-weight-info" class="text-info" style="font-size: 0.75rem;">(잔여: 100%)</span>
                            </label>
                            <div class="input-group">
                                <input type="number" name="weight" id="new-element-weight" class="form-control ees-form-control text-center" placeholder="0" min="0" max="100" required>
                                <span class="input-group-text bg-dark border-secondary text-muted">%</span>
                            </div>
                        </div>

                        <button type="submit" class="btn ees-btn-glass-primary w-100 py-3 mt-2 shadow-sm">
                            <i class="bi bi-plus-lg me-1"></i> 추가하기
                        </button>
                    </form>
                </div>
            </div>
        </div>

        </th:block>

        <script th:inline="javascript">
            (function() {
                function initWeightValidation() {
                    // 1. 유형별 가중치(성과/역량) 동기화 로직
                    const syncInputs = document.querySelectorAll('.weight-input-sync');
                    const saveBtn = document.querySelector('.weight-save-btn');
                    
                    if (syncInputs.length === 2 && saveBtn) {
                        const input1 = syncInputs[0];
                        const input2 = syncInputs[1];

                        function syncWeights(e) {
                            const current = e.target;
                            const other = (current === input1) ? input2 : input1;
                            
                            let val = parseInt(current.value);
                            if (isNaN(val)) val = 0;
                            if (val > 100) val = 100;
                            if (val < 0) val = 0;
                            
                            current.value = val;
                            other.value = 100 - val;
                            validateWeights();
                        }

                        function validateWeights() {
                            let total = 0;
                            syncInputs.forEach(input => {
                                total += parseInt(input.value) || 0;
                            });

                            if (total !== 100) {
                                saveBtn.disabled = true;
                                saveBtn.classList.add('opacity-50');
                                saveBtn.innerHTML = `<i class="bi bi-exclamation-triangle me-1"></i>합계 100% 필요`;
                            } else {
                                saveBtn.disabled = false;
                                saveBtn.classList.remove('opacity-50');
                                saveBtn.innerHTML = `<i class="bi bi-check-lg me-1"></i>저장`;
                            }
                        }

                        syncInputs.forEach(input => {
                            input.addEventListener('input', syncWeights);
                        });
                        validateWeights();
                    }

                    // 2. 개별 문항 추가 시 잔여 가중치 계산 로직
                    const typeSelect = document.querySelector('select[name="elementTypeCode"]');
                    const infoSpan = document.getElementById('remaining-weight-info');
                    const weightInput = document.getElementById('new-element-weight');

                    function updateRemainingWeight() {
                        if (!typeSelect || !infoSpan) return;

                        const selectedType = typeSelect.value;
                        const tableRows = document.querySelectorAll('.ees-table tbody tr');
                        let currentSum = 0;

                        tableRows.forEach(row => {
                            const badge = row.querySelector('.ees-badge');
                            if (!badge) return;
                            
                            let rowType = '';
                            if (badge.classList.contains('ees-badge-performance')) rowType = 'PERFORMANCE';
                            else if (badge.classList.contains('ees-badge-competency')) rowType = 'COMPETENCY';
                            else if (badge.classList.contains('ees-badge-multi')) rowType = 'MULTI_DIMENSIONAL';

                            if (rowType === selectedType) {
                                const weightBadge = row.querySelector('span.badge.bg-dark');
                                if (weightBadge) {
                                    currentSum += parseInt(weightBadge.textContent) || 0;
                                }
                            }
                        });

                        const remaining = 100 - currentSum;
                        infoSpan.textContent = `(잔여: ${remaining}%)`;
                        if (weightInput) weightInput.placeholder = remaining > 0 ? remaining : 0;
                    }

                    if (typeSelect) {
                        typeSelect.addEventListener('change', updateRemainingWeight);
                        updateRemainingWeight(); // 초기 실행
                    }
                }

                initWeightValidation();
                document.body.addEventListener('htmx:afterSettle', initWeightValidation);
            })();
        </script>
    </div>
</body>

</html>
