<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, ${activeMenu ?: 'final-grade'}, ~{::extraStyles}, ~{})}">

<head>
    <title>최종 등급 확정 - EES</title>
    <th:block th:fragment="extraStyles">
        <style>
            .eval-list-container {
                background: var(--glass);
                backdrop-filter: blur(12px);
                -webkit-backdrop-filter: blur(12px);
                border-radius: 1rem;
                box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
                border: 1px solid var(--glass-border);
                overflow: hidden;
                margin-top: 20px;
            }

            .eval-list-item {
                display: flex;
                align-items: center;
                padding: 18px 24px;
                border-bottom: 1px solid var(--glass-border);
                transition: background-color 0.2s ease;
            }

            .eval-list-item:last-child {
                border-bottom: none;
            }

            .eval-list-item:hover {
                background-color: rgba(255, 255, 255, 0.05);
            }

            .eval-name {
                font-size: 1.1rem;
                font-weight: 700;
                color: var(--text-main);
                min-width: 140px;
            }

            .badge-dept {
                background-color: var(--surface-light);
                color: var(--text-main);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 6px;
                margin-right: 16px;
                border: 1px solid var(--glass-border);
            }

            .badge-status {
                background-color: rgba(245, 158, 11, 0.2);
                color: #fbd38d;
                border: 1px solid rgba(245, 158, 11, 0.3);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 4px 12px;
                border-radius: 6px;
                display: inline-flex;
                align-items: center;
                gap: 6px;
            }
        </style>
    </th:block>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" th:fragment="content">
        <!-- Re-include styles for HTMX swaps -->
        <th:block th:replace="~{::extraStyles}"></th:block>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-white fs-3 mb-1"><i class="bi bi-check-all text-primary me-2"></i>최종 등급 확정</h1>
                <p class="text-muted mb-0 small">배정된 인원에 대한 성과 및 역량 최종 등급을 확정해주세요.</p>
            </div>
            <div>
                <form th:action="@{/eval/final-grade}" method="get"
                    class="d-inline-flex gap-2 align-items-center bg-dark p-2 rounded-pill shadow-sm"
                    style="border: 1px solid var(--glass-border);">
                    <select name="periodId"
                        class="form-select form-select-sm bg-transparent text-white border-0 fw-bold"
                        onchange="this.form.submit()" style="width: 200px; box-shadow: none;">
                        <option class="bg-dark" th:each="p : ${periods}" th:value="${p.periodId()}"
                            th:text="${'[' + p.periodYear() + '] ' + p.periodName()}"
                            th:selected="${selectedPeriod?.periodId() == p.periodId()}">차수 선택</option>
                    </select>
                </form>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert"
            style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 0.75rem;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div th:text="${errorMessage}"></div>
        </div>

        <!-- 정보 메시지 -->
        <div th:if="${infoMessage}"
            class="ees-card p-4 text-center mb-4"
            style="color:rgba(255,255,255,.5)">
            <i class="bi bi-info-circle me-1"></i>
            <span th:text="${infoMessage}"></span>
        </div>

        <div sec:authorize="hasAnyRole('EXECUTIVE', 'ADMIN')" th:if="${selectedPeriod != null}">


            <div th:if="${selectedPeriod.statusCode() != 'PLANNED'}">
                <h5 class="text-white fw-bold mb-3 mt-2"><i class="bi bi-people-fill text-primary me-2"></i>최종 등급 확정 대상자</h5>
                
                <div th:if="${tasks == null || tasks.isEmpty()}"
                    class="ees-card text-center py-4 border-0 shadow-sm rounded-3 mb-4">
                    <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                    <h5 class="fw-bold text-white">확정 대상자가 없습니다.</h5>
                </div>
                
                <div th:if="${tasks != null && !tasks.isEmpty()}">
                    <!-- 사원 관리와 동일하게 탭을 카드 밖으로 배치 -->
                    <div class="nav-tabs-custom mb-3">
                        <button class="nav-link-custom" th:classappend="${activeTab == 'leader' ? 'active' : ''}" id="leader-tab" 
                            data-target="#leader-content" type="button" role="tab">
                            <i class="bi bi-person-badge-fill"></i> 부서장
                        </button>
                        <button class="nav-link-custom" th:classappend="${activeTab == 'staff' ? 'active' : ''}" id="staff-tab" 
                            data-target="#staff-content" type="button" role="tab">
                            <i class="bi bi-people-fill"></i> 일반사원
                        </button>
                    </div>

                    <div class="ees-card overflow-hidden">
                        <div class="tab-content" id="evalTabContent">
                            <!-- 부서장 리스트 -->
                            <div class="tab-pane fade" th:classappend="${activeTab == 'leader' ? 'show active' : ''}" id="leader-content" role="tabpanel">
                                <div th:each="task : ${tasks}" th:if="${task.isLeader()}" class="eval-list-item">
                                    <div class="eval-name" th:text="${task.evaluateeName()}">대상자 이름</div>
                                    
                                    <div th:if="${teamSubmittedMap == null || !teamSubmittedMap.getOrDefault(task.mappingId(), false)}"
                                        class="badge-status">
                                        <i class="bi bi-hourglass-split"></i> 확정 대기
                                    </div>
                                    <div th:if="${teamSubmittedMap != null && teamSubmittedMap.getOrDefault(task.mappingId(), false)}"
                                        class="badge-status"
                                        style="background:rgba(34,197,94,0.15);color:#86efac;border-color:rgba(34,197,94,0.3);">
                                        <i class="bi bi-check-circle-fill"></i> 확정 완료
                                    </div>
                                    
                                    <div class="flex-grow-1"></div>
                                    
                                    <div>
                                        <a th:if="${evaluateeSelfSubmittedMap != null && evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false) && teamWeightValidMap != null && teamWeightValidMap.getOrDefault(task.mappingId(), false)}"
                                            href="#" class="btn ees-btn-glass-primary btn-sm"
                                            th:attr="hx-get=@{/eval/final-grade/form(mappingId=${task.mappingId()}, tab='leader')}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true">
                                            <i class="bi bi-pencil-square"></i> <span
                                                th:text="${teamSubmittedMap != null && teamSubmittedMap.getOrDefault(task.mappingId(), false)} ? '확정 내용 수정' : '등급 확정 시작'"></span>
                                        </a>
                                        <button th:if="${teamWeightValidMap == null || !teamWeightValidMap.getOrDefault(task.mappingId(), false)}"
                                            class="btn-evaluate" style="background-color: #92400e; cursor: not-allowed; opacity: 0.7;" disabled>
                                            <i class="bi bi-lock-fill"></i> 가중치 미설정
                                        </button>
                                        <button th:if="${teamWeightValidMap != null && teamWeightValidMap.getOrDefault(task.mappingId(), false) && (evaluateeSelfSubmittedMap == null || !evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false))}"
                                            class="btn-evaluate" style="background-color: #4b5563; cursor: not-allowed; opacity: 0.7;" disabled>
                                            <i class="bi bi-lock-fill"></i> 자가평가 대기중
                                        </button>
                                    </div>
                                </div>
                                <div th:if="${leaderCount == 0}" class="p-5 text-center text-muted">
                                    부서장 확정 대상자가 없습니다.
                                </div>
                            </div>

                            <!-- 일반사원 리스트 -->
                            <div class="tab-pane fade" th:classappend="${activeTab == 'staff' ? 'show active' : ''}" id="staff-content" role="tabpanel">
                                <div th:each="task : ${tasks}" th:if="${!task.isLeader()}" class="eval-list-item">
                                    <div class="eval-name" th:text="${task.evaluateeName()}">대상자 이름</div>
                                    
                                    <div th:if="${teamSubmittedMap == null || !teamSubmittedMap.getOrDefault(task.mappingId(), false)}"
                                        class="badge-status">
                                        <i class="bi bi-hourglass-split"></i> 확정 대기
                                    </div>
                                    <div th:if="${teamSubmittedMap != null && teamSubmittedMap.getOrDefault(task.mappingId(), false)}"
                                        class="badge-status"
                                        style="background:rgba(34,197,94,0.15);color:#86efac;border-color:rgba(34,197,94,0.3);">
                                        <i class="bi bi-check-circle-fill"></i> 확정 완료
                                    </div>
                                    
                                    <div class="flex-grow-1"></div>
                                    
                                    <div>
                                        <a th:if="${evaluateeSelfSubmittedMap != null && evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false) && teamWeightValidMap != null && teamWeightValidMap.getOrDefault(task.mappingId(), false)}"
                                            href="#" class="btn ees-btn-glass-primary btn-sm"
                                            th:attr="hx-get=@{/eval/final-grade/form(mappingId=${task.mappingId()}, tab='staff')}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true">
                                            <i class="bi bi-pencil-square"></i> <span
                                                th:text="${teamSubmittedMap != null && teamSubmittedMap.getOrDefault(task.mappingId(), false)} ? '확정 내용 수정' : '등급 확정 시작'"></span>
                                        </a>
                                        <button th:if="${teamWeightValidMap == null || !teamWeightValidMap.getOrDefault(task.mappingId(), false)}"
                                            class="btn-evaluate" style="background-color: #92400e; cursor: not-allowed; opacity: 0.7;" disabled>
                                            <i class="bi bi-lock-fill"></i> 가중치 미설정
                                        </button>
                                        <button th:if="${teamWeightValidMap != null && teamWeightValidMap.getOrDefault(task.mappingId(), false) && (evaluateeSelfSubmittedMap == null || !evaluateeSelfSubmittedMap.getOrDefault(task.mappingId(), false))}"
                                            class="btn-evaluate" style="background-color: #4b5563; cursor: not-allowed; opacity: 0.7;" disabled>
                                            <i class="bi bi-lock-fill"></i> 자가평가 대기중
                                        </button>
                                    </div>
                                </div>
                                <div th:if="${staffCount == 0}" class="p-5 text-center text-muted">
                                    일반사원 확정 대상자가 없습니다.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            </div>
        </div>

        <div id="page-scripts">
            <!-- 탭 초기화 스크립트는 eval-integrity.js의 htmx:afterSettle 핸들러로 이전됨 -->
        </div>
    </div>
</body>
</html>
