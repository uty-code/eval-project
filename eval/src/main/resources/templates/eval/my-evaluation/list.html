<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'my-evaluation', ~{::extraStyles}, ~{})}">

<head>
    <title>나의 자가평가 - EES</title>
    <th:block th:fragment="extraStyles">
        <style>
            /* ===== 필터 바 ===== */
            .filter-bar select,
            .filter-bar input {
                background: rgba(255, 255, 255, .06);
                border: 1px solid rgba(255, 255, 255, .12);
                color: #cbd5e1;
                font-size: .85rem;
                padding: .4rem .7rem;
                border-radius: 20px;
                outline: none;
            }

            .filter-bar select:focus,
            .filter-bar input:focus {
                background: rgba(0, 0, 0, 0.3);
                border-color: rgba(99, 102, 241, 0.5);
            }

            .btn-search {
                background: linear-gradient(90deg, #6366f1, #a855f7);
                color: #fff;
                border: none;
                border-radius: 20px;
                font-size: .8rem;
                font-weight: 700;
                cursor: pointer;
                transition: all .2s;
            }

            .btn-search:hover {
                transform: translateY(-1px);
                box-shadow: 0 4px 15px rgba(99, 102, 241, .4);
            }

            /* ===== 테이블 ===== */
            .result-table-wrap {
                padding: 1rem 1.5rem 1.5rem;
                overflow-x: auto;
            }

            .result-table {
                width: 100%;
                border-collapse: separate;
                border-spacing: 0;
                font-size: .78rem;
                border-top: 1px solid rgba(255, 255, 255, .35);
                border-left: 1px solid rgba(255, 255, 255, .35);
                border-right: 1px solid rgba(255, 255, 255, .35);
                min-width: 900px;
                table-layout: fixed;
            }

            .result-table thead th {
                padding: .65rem .5rem;
                text-align: center;
                font-weight: 600;
                color: rgba(255, 255, 255, .7);
                white-space: nowrap;
                border-bottom: 1px solid rgba(255, 255, 255, .35);
                background: rgba(255, 255, 255, .02);
            }

            .th-group {
                font-size: .8rem;
                font-weight: 700;
                letter-spacing: .5px;
            }

            .th-group-info {
                color: rgba(255, 255, 255, .5);
            }

            .th-group-action {
                color: #f59e0b !important;
            }

            .result-table tbody td {
                padding: .85rem .7rem;
                text-align: center;
                color: rgba(255, 255, 255, .8);
                border-bottom: 1px solid rgba(255, 255, 255, .35);
                vertical-align: middle;
            }

            .result-table tbody tr:hover {
                background: rgba(255, 255, 255, .03);
            }

            /* ===== 상태 배지 ===== */
            .status-badge {
                font-size: .65rem;
                padding: .3rem .6rem;
                border-radius: 12px;
                font-weight: 600;
                white-space: nowrap;
                display: inline-block;
            }

            .status-done {
                background: rgba(16, 185, 129, .15);
                color: #34d399;
                border: 1px solid rgba(16, 185, 129, .3);
            }

            .status-prog {
                background: rgba(56, 189, 248, .15);
                color: #7dd3fc;
                border: 1px solid rgba(56, 189, 248, .3);
            }

            .status-wait {
                background: rgba(245, 158, 11, .15);
                color: #fcd34d;
                border: 1px solid rgba(245, 158, 11, .3);
            }

            /* ===== 버튼 배지 ===== */
            .action-btn {
                font-size: .75rem;
                padding: .35rem .8rem;
                border-radius: 6px;
                font-weight: 600;
                border: none;
                transition: all 0.2s;
                text-decoration: none;
                display: inline-flex;
                align-items: center;
                gap: 0.3rem;
            }

            .action-primary {
                background: linear-gradient(90deg, #6366f1, #a855f7);
                color: #fff;
                box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
            }

            .action-primary:hover {
                background: linear-gradient(90deg, #4f46e5, #9333ea);
                color: #fff;
                transform: translateY(-1px);
            }

            .action-view {
                background-color: #475569;
                color: #fff;
            }

            .action-view:hover {
                background-color: #334155;
            }

            .action-locked {
                background-color: #475569;
                color: #fff;
            }

            .pagination-container {
                display: flex;
                justify-content: center;
                margin-top: 1.5rem;
                gap: 0.25rem;
            }

            .col-period,
            .col-dept,
            .col-title,
            .col-empid,
            .col-name {
                width: 130px;
            }
        </style>
    </th:block>
</head>

<body>
    <div id="page-content" class="container-fluid py-4" th:fragment="content">
        <th:block th:replace="~{::extraStyles}"></th:block>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="text-white fs-3 mb-1"><i class="bi bi-person-workspace text-primary me-2"></i>나의 자가평가</h1>
                <p class="text-muted mb-0 small">차수별 나의 성과와 역량을 진단하고 기록합니다.</p>
            </div>
        </div>

        <!-- 메시지 영역 -->
        <div th:if="${errorMessage}" class="alert alert-danger d-flex align-items-center mb-3" role="alert"
            style="background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 0.75rem;">
            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
            <div th:text="${errorMessage}"></div>
        </div>
        <div th:if="${successMessage}" class="alert d-flex align-items-center mb-3" role="alert"
            style="background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.3); color: #86efac; border-radius: 0.75rem;">
            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
            <div th:text="${successMessage}"></div>
        </div>

        <div id="my-eval-container">
            <!-- 필터 섹션 -->
            <div class="ees-card mb-4 p-3">
                <form id="filterForm" hx-get="/eval/my-evaluation/list" hx-target="#my-eval-container"
                    hx-select="#my-eval-container" hx-swap="outerHTML" hx-push-url="true" hx-sync="this:replace">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label text-muted small fw-semibold">평가 차수</label>
                            <select name="periodId"
                                class="form-select bg-transparent border-secondary border-opacity-50 fw-bold"
                                style="color: #fff; font-size: 0.85rem; border-radius: 8px;">
                                <option value="">전체 차수</option>
                                <option th:each="p : ${periods}" th:value="${p.periodId()}"
                                    th:text="${'[' + p.periodYear() + '] ' + p.periodName()}"
                                    th:selected="${selectedPeriodId == p.periodId()}"></option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small fw-semibold">작성 상태</label>
                            <select name="filterStatus"
                                class="form-select bg-transparent border-secondary border-opacity-50"
                                style="color: #cbd5e1; font-size: 0.85rem; border-radius: 8px;">
                                <option value="">전체 상태</option>
                                <option value="WAITING" th:selected="${filterStatus == 'WAITING'}">작성 대기</option>
                                <option value="SUBMITTED" th:selected="${filterStatus == 'SUBMITTED'}">제출 완료</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label text-muted small fw-semibold">차수명 검색</label>
                            <input type="text" name="keyword"
                                class="form-control bg-transparent border-secondary border-opacity-50 text-white"
                                placeholder="차수 이름 입력" th:value="${keyword}"
                                style="font-size: 0.85rem; border-radius: 8px;">
                        </div>
                        <div class="col-md-2">
                            <button type="submit" class="btn-search w-100" style="height: 38px;">
                                <i class="bi bi-search me-1"></i>검색
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- 데이터 없음 -->
            <div th:if="${pageData == null || pageData.content().isEmpty()}" class="ees-card text-center py-5">
                <i class="bi bi-inbox fs-1 text-muted mb-3 d-block"></i>
                <h5 class="fw-bold text-white">조회된 자가평가 내역이 없습니다.</h5>
            </div>

            <!-- 테이블 영역 -->
            <div th:if="${pageData != null && !pageData.content().isEmpty()}" class="ees-card mb-5">
                <div class="result-table-wrap">
                    <table class="result-table">
                        <thead>
                            <tr>
                                <th class="col-period" style="width: 15.6%;">평가 차수</th>
                                <th class="col-dept" style="width: 18.2%;">부서</th>
                                <th class="col-title" style="width: 10.4%;">직급</th>
                                <th class="col-empid" style="width: 100px; width: 10.4%;">사번</th>
                                <th class="col-name" style="width: 13.0%; border-right: 1px solid rgba(255, 255, 255, .35);">성명</th>
                                <th style="width: 11.7%; border-right: 1px solid rgba(255, 255, 255, .35);">환산 점수</th>
                                <th style="width: 10.4%; border-right: 1px solid rgba(255, 255, 255, .35);">상태</th>
                                <th style="width: 10.3%;">진행</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="r : ${pageData.content()}">
                                <td class="col-period text-center" style="text-align: center !important;"
                                    th:text="${r.periodName()}">2024 상반기</td>
                                <td class="col-dept" th:text="${r.deptName()}">-</td>
                                <td class="col-title" th:text="${r.titleName()}">-</td>
                                <td class="col-empid" th:text="${r.empId()}">-</td>
                                <td class="col-name"
                                    style="border-right: 1px solid rgba(255, 255, 255, .35);" th:text="${r.name()}">-
                                </td>
                                <td class="fw-bold text-center"
                                    style="color: #a855f7; border-right: 1px solid rgba(255, 255, 255, .35);">
                                    <span th:if="${r.score() != null}"
                                        th:text="${#numbers.formatDecimal(r.score(), 1, 1)}">0.0</span>
                                    <span th:if="${r.score() == null}">-</span>
                                </td>
                                <td style="border-right: 1px solid rgba(255, 255, 255, .35);">
                                    <!-- 상태 배지 -->
                                    <span class="status-badge"
                                        th:classappend="${r.statusType().name() == 'SUBMITTED' ? 'status-done' : (r.statusType().name() == 'IN_PROGRESS' ? 'status-prog' : 'status-wait')}"
                                        th:text="${r.statusType().name() == 'SUBMITTED' ? '완료' : (r.statusType().name() == 'IN_PROGRESS' ? '진행중' : '대기')}">대기</span>
                                </td>
                                <td style="border-right: 1px solid rgba(255, 255, 255, .35);">
                                    <!-- 액션 버튼 -->
                                    <div class="action-wrap">
                                        <!-- 작성하기/수정하기 -->
                                        <a th:if="${r.ctaType().name() == 'EDIT'}" href="#"
                                            class="action-btn action-primary"
                                            th:attr="hx-get=@{/eval/my-evaluation/wizard(mappingId=${r.mappingId()})}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true">
                                            <i class="bi bi-pencil-square"></i>
                                            <span th:text="${r.isSubmitted ? '수정' : '진행'}">진행</span>
                                        </a>
                                        <!-- 조회하기 -->
                                        <a th:if="${r.ctaType().name() == 'VIEW'}" href="#"
                                            class="action-btn action-view"
                                            th:attr="hx-get=@{/eval/my-evaluation/wizard(mappingId=${r.mappingId()})}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true">
                                            <i class="bi bi-search"></i> 조회
                                        </a>
                                        <!-- 잠김 -->
                                        <a th:if="${r.ctaType().name() == 'LOCKED'}" href="#"
                                            class="action-btn action-locked"
                                            th:attr="hx-get=@{/eval/my-evaluation/wizard(mappingId=${r.mappingId()})}"
                                            hx-target="#page-content" hx-select="#page-content" hx-swap="outerHTML"
                                            hx-push-url="true">
                                            <i class="bi bi-search"></i> 조회
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- 페이징네이션 -->
                <div th:if="${pageData.totalPages() > 1}" class="pagination-container pb-4">
                    <button class="btn btn-sm btn-outline-secondary text-white border-0"
                        th:classappend="${pageData.currentPage() <= 1} ? 'disabled'"
                        th:attr="hx-get=@{/eval/my-evaluation/list(periodId=${selectedPeriodId}, filterStatus=${filterStatus}, keyword=${keyword}, page=${pageData.currentPage() - 1})}"
                        hx-target="#my-eval-container" hx-select="#my-eval-container" hx-swap="outerHTML"
                        hx-push-url="true">
                        <i class="bi bi-chevron-left"></i>
                    </button>

                    <button th:each="i : ${#numbers.sequence(1, pageData.totalPages())}"
                        th:class="${i == pageData.currentPage()} ? 'btn btn-sm btn-primary' : 'btn btn-sm btn-outline-secondary text-white border-0'"
                        th:text="${i}"
                        th:attr="hx-get=@{/eval/my-evaluation/list(periodId=${selectedPeriodId}, filterStatus=${filterStatus}, keyword=${keyword}, page=${i})}"
                        hx-target="#my-eval-container" hx-select="#my-eval-container" hx-swap="outerHTML"
                        hx-push-url="true">
                    </button>

                    <button class="btn btn-sm btn-outline-secondary text-white border-0"
                        th:classappend="${pageData.currentPage() >= pageData.totalPages()} ? 'disabled'"
                        th:attr="hx-get=@{/eval/my-evaluation/list(periodId=${selectedPeriodId}, filterStatus=${filterStatus}, keyword=${keyword}, page=${pageData.currentPage() + 1})}"
                        hx-target="#my-eval-container" hx-select="#my-eval-container" hx-swap="outerHTML"
                        hx-push-url="true">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
