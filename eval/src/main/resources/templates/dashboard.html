<html xmlns:th="http://www.thymeleaf.org"
    th:replace="~{layout/layout :: layout(~{::title}, ~{::#page-content}, 'dashboard', ~{}, ~{})}" data-bs-theme="dark">

<head>
    <title>Dashboard - EES 사원 평가 시스템</title>
</head>

<body>

    <div id="page-content" class="container-fluid py-4" data-bs-theme="dark" th:fragment="content">
        <!-- Dashboard Header -->
        <div class="row align-items-center mb-4">
            <div class="col-md-8">
                <h1 class="fw-bold fs-3 mb-1">시스템 대시보드</h1>
                <p class="text-muted" th:text="${welcomeMessage}">EES 관리자 페이지에 오신 것을 환영합니다.</p>
            </div>
            <div class="col-md-4 text-md-end">
                <button class="btn btn-outline-primary btn-sm px-3" onclick="location.href='/eval/result/excel'">
                    <i class="bi bi-download me-2"></i>리포트 다운로드
                </button>
            </div>
        </div>

        <!-- Stats Cards Row -->
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="ees-card stat-card">
                    <div class="stat-icon icon-blue">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <h6 class="text-muted small mb-1">전체 사원 수</h6>
                    <h3 class="fw-bold mb-0" th:text="${employeeCount + ' 명'}">0 명</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="ees-card stat-card">
                    <div class="stat-icon icon-purple">
                        <i class="bi bi-diagram-3-fill"></i>
                    </div>
                    <h6 class="text-muted small mb-1">전체 부서 수</h6>
                    <h3 class="fw-bold mb-0" th:text="${departmentCount + ' 개'}">0 개</h3>
                </div>
            </div>
            <div class="col-md-4">
                <div class="ees-card stat-card">
                    <div class="stat-icon icon-indigo">
                        <i class="bi bi-calendar-check"></i>
                    </div>
                    <div class="w-100">
                        <div class="d-flex justify-content-between align-items-center mb-1">
                            <h6 class="text-muted small mb-0" th:text="${activePeriodName}">2026년 상반기 평가</h6>
                            <span class="badge bg-primary rounded-pill" th:text="${completionRate + '%'}">75%</span>
                        </div>
                        <h3 class="fw-bold mb-2" th:text="${stats.finalizedCount + ' / ' + stats.totalEvaluatees + ' 명'}">120 / 150 명</h3>
                        <div class="progress" style="height: 6px; background-color: rgba(255,255,255,0.1);">
                            <div class="progress-bar bg-primary" role="progressbar" 
                                 th:style="'width: ' + ${completionRate} + '%'" 
                                 th:aria-valuenow="${completionRate}" aria-valuemin="0" aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts Row -->
        <div class="row g-4 mb-4">
            <div class="col-lg-6">
                <div class="ees-card p-4 h-100">
                    <h5 class="fw-bold mb-4">전사 등급 분포</h5>
                    <div style="height: 300px; position: relative;">
                        <canvas id="gradeChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                <div class="ees-card p-4 h-100">
                    <h5 class="fw-bold mb-4">부서별 평균 점수</h5>
                    <div style="height: 300px; position: relative;">
                        <canvas id="deptChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bottom Content -->
        <div class="row g-4">
            <!-- Recent Activity -->
            <div class="col-lg-8">
                <div class="ees-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">평가 확정 현황 (최근 완료)</h5>
                        <a href="/eval/result" hx-get="/eval/result" hx-target="#page-content" hx-select="#page-content"
                            hx-swap="outerHTML" hx-push-url="true" hx-sync="body:replace"
                            class="btn btn-link text-primary text-decoration-none p-0 small">전체 보기</a>
                    </div>
                    <div class="table-responsive">
                        <table class="ees-table align-middle">
                            <thead>
                                <tr class="text-muted small border-bottom border-secondary opacity-50">
                                    <th class="py-3">피평가자</th>
                                    <th class="py-3">부서</th>
                                    <th class="py-3">활동</th>
                                    <th class="py-3">시간</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="act : ${recentActivities}">
                                    <td class="py-3">
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="bg-primary bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center"
                                                style="width: 32px; height: 32px;">
                                                <i class="bi bi-check-circle-fill text-primary"></i>
                                            </div>
                                            <span th:text="${act.evaluateeName}">-</span>
                                        </div>
                                    </td>
                                    <td th:text="${act.deptName}">-</td>
                                    <td>
                                        <span class="ees-badge ees-badge-self" th:text="${act.activityType}">최종 확정</span>
                                    </td>
                                    <td class="text-muted small" th:text="${#temporals.format(act.activityTime, 'MM-dd HH:mm')}">-</td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(recentActivities)}">
                                    <td colspan="4" class="text-center text-muted py-4">
                                        <i class="bi bi-inbox me-2"></i>최근 확정된 평가가 없습니다.
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Quick Access -->
            <div class="col-lg-4">
                <div class="ees-card p-4 mb-4">
                    <h5 class="fw-bold mb-3">주요 기능</h5>
                    <div class="d-grid gap-2">
                        <a th:href="@{/eval/periods}" hx-get="/eval/periods" hx-target="#page-content"
                            hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true" hx-sync="body:replace"
                            class="btn btn-outline-light text-start py-3 d-flex justify-content-between align-items-center">
                            <span>평가 차수 설정</span>
                            <i class="bi bi-calendar-event"></i>
                        </a>
                        <a th:href="@{/employees}" hx-get="/employees" hx-target="#page-content"
                            hx-select="#page-content" hx-swap="outerHTML" hx-push-url="true" hx-sync="body:replace"
                            class="btn btn-outline-light text-start py-3 d-flex justify-content-between align-items-center">
                            <span>사원 명부 관리</span>
                            <i class="bi bi-people"></i>
                        </a>
                    </div>
                </div>

                <div class="ees-card p-4 bg-primary bg-opacity-10 border-primary border-opacity-25">
                    <h6 class="fw-bold mb-2 text-primary">알림</h6>
                    <p class="text-muted small mb-0">현재 2026년 상반기 정기 평가가 진행 중입니다. 평가 항목 점수 비중을 다시 한번 확인해 주세요.</p>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            (function () {
                function initCharts() {
                    const gradeData = /*[[${gradeStats}]]*/ {};
                    const gradeCanvas = document.getElementById('gradeChart');
                    // Ensure we only initialize if the canvas exists AND it belongs to the dashboard (check a parent class or context)
                    if (gradeCanvas && document.querySelector('.stat-card')) {
                        const gradeCtx = gradeCanvas.getContext('2d');
                        const existingGradeChart = Chart.getChart(gradeCanvas);
                        if (existingGradeChart) existingGradeChart.destroy();
                        new Chart(gradeCtx, {
                            type: 'doughnut',
                            data: (() => {
                                const order = { 'S': 1, 'A': 2, 'B': 3, 'C': 4, 'D': 5 };
                                const colorMap = {
                                    'S': '#10b981', // Green
                                    'A': '#8b5cf6', // Purple
                                    'B': '#3b82f6', // Blue
                                    'C': '#f59e0b', // Orange
                                    'D': '#ef4444'  // Red
                                };
                                const keys = Object.keys(gradeData).sort((a,b) => (order[a] || 99) - (order[b] || 99));
                                return {
                                    labels: keys.map(k => k + '등급 (' + gradeData[k] + '명)'),
                                    datasets: [{
                                        data: keys.map(k => gradeData[k]),
                                        backgroundColor: keys.map(k => colorMap[k] || '#888888'),
                                        borderWidth: 0,
                                        hoverOffset: 15
                                    }]
                                };
                            })(),
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { position: 'right', labels: { color: 'rgba(255, 255, 255, 0.7)', usePointStyle: true, padding: 20 } } },
                                cutout: '70%'
                            }
                        });
                    }

                    const deptData = /*[[${deptStats}]]*/ {};
                    const deptCanvas = document.getElementById('deptChart');
                    if (deptCanvas && document.querySelector('.stat-card')) {
                        const deptCtx = deptCanvas.getContext('2d');
                        const existingDeptChart = Chart.getChart(deptCanvas);
                        if (existingDeptChart) existingDeptChart.destroy();
                        new Chart(deptCtx, {
                            type: 'bar',
                            data: {
                                labels: Object.keys(deptData),
                                datasets: [{
                                    label: '평가 점수',
                                    data: Object.values(deptData),
                                    backgroundColor: 'rgba(99, 102, 241, 0.5)',
                                    borderColor: '#6366f1',
                                    borderWidth: 1,
                                    borderRadius: 5
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                scales: {
                                    y: { beginAtZero: true, max: 100, grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { color: 'rgba(255, 255, 255, 0.5)' } },
                                    x: { grid: { display: false }, ticks: { color: 'rgba(255, 255, 255, 0.5)' } }
                                },
                                plugins: { legend: { display: false } }
                            }
                        });
                    }
                }
                
                // Initialize on load
                initCharts();
                
                // For HTMX swaps that target the dashboard specifically
                document.addEventListener('htmx:afterSettle', function(evt) {
                    if (evt.detail.target.id === 'page-content' && document.querySelector('.stat-card')) {
                        initCharts();
                    }
                }, { once: true }); // Use once: true to prevent accumulation, or better yet, don't use global listener
            })();
        </script>
    </div>
</body>
</html>
