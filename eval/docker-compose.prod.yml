version: '3.8'

services:
  ees-eval-app:
    image: siujeong/ees-eval-app:${TAG}
    container_name: ees-eval-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      # [보안 고도화] Azure SQL 등 상용 운영 DB 환경에 맞게 무조건적인 인증서 우회를 방어하고 철저히 TLS 검증 강제
      - DB_URL=jdbc:sqlserver://${DB_HOST}:${DB_PORT};databaseName=${DB_NAME};encrypt=true;trustServerCertificate=false;
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # [안정성 격상] 1G 컨테이너 메모리 제한 하에서 JVM이 OS에 OOM 당하지 않도록 힙 메모리 크기를 철저히 규제
      - JAVA_OPTS=-Xms512m -Xmx768m
    restart: unless-stopped
    # [로그 유실 방지] 컨테이너 폭파/롤백/재시작 시에도 톰캣 비동기 감사 로그(Access Log)가 지켜지도록 호스트 영속 볼륨 마운트
    volumes:
      - /opt/ees/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # [안정성 극상] Swarm 이외의 Standalone docker compose 환경에서도 실질적인 1G 메모리 한계 제한 작동 보장
    mem_limit: 1g
    deploy:
      resources:
        limits:
          memory: 1G
    # [정밀 동기화] application.yml의 내부 모니터링 우회 경로(/internal-monitor/health)와 컴포즈 헬스체크 주소를 완벽하게 동기화
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/internal-monitor/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
