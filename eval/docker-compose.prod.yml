version: '3.8'

services:
  ees-eval-app:
    image: siujeong/ees-eval-app:${TAG}
    container_name: ees-eval-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # [DB 연결] SKU 공용 DB 직접 연결 - .env의 DB_URL 단일 변수로 관리
      - DB_URL=${DB_URL}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      # 컨테이너 메모리(1G) 제한에 맞춰 JVM 힙 크기 설정
      - JAVA_OPTS=-Xms512m -Xmx768m
    restart: unless-stopped
    # 컨테이너 삭제/재시작 시에도 톰캣 Access Log 보존을 위해 볼륨 마운트
    volumes:
      - /opt/ees/logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Standalone docker compose 환경 메모리 제한 (compatibility 모드 지원)
    deploy:
      resources:
        limits:
          memory: 1G
    # 헬스체크 엔드포인트 설정 (application.yml 모니터링 경로와 동일)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/internal-monitor/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
