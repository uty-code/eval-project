# ==========================================================================
# EES Nginx 리버스 프록시 - HTTP 전용 초기 설정
# SSL 인증서 발급 전까지 사용되는 설정 파일입니다.
# 인증서 발급 후 nginx-ssl.conf로 교체됩니다.
# ==========================================================================

server {
    listen 80;
    server_name ees-eval.com www.ees-eval.com;
    server_tokens off;

    # Certbot 도메인 소유권 검증용 특수 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 스프링 부트로 리버스 프록시
    location / {
        proxy_pass http://ees-eval-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
