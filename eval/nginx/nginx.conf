# ==========================================================================
# EES Nginx 리버스 프록시 - HTTPS 보안 설정
# HTTP(80) → HTTPS(443) 강제 리다이렉트 + SSL 리버스 프록시
# ==========================================================================

# HTTP → HTTPS 강제 리다이렉트
server {
    listen 80;
    server_name ees-eval.com;
    server_tokens off;

    # Certbot 인증서 갱신용 경로 유지
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 그 외 모든 HTTP 요청은 HTTPS로 영구 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 보안 서버 블록
server {
    listen 443 ssl;
    server_name ees-eval.com;
    server_tokens off;

    # Let's Encrypt 인증서 경로
    ssl_certificate /etc/letsencrypt/live/ees-eval.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ees-eval.com/privkey.pem;

    # SSL 보안 프로토콜 (TLS 1.2 이하 차단)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 보안 헤더
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    # HSTS는 HTTPS 완전 안정화 후 추가 예정
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # 리버스 프록시 → 도커 내부 스프링 부트
    location / {
        proxy_pass http://ees-eval-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
